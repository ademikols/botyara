<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Игры</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;min-height:100vh;overflow-x:hidden}
  .top{padding:14px 16px;border-bottom:1px solid #1a1a1a;text-align:center}
  .top h1{font-size:13px;letter-spacing:4px;font-weight:700;text-transform:uppercase}
  .screen{display:none;padding:20px}
  .screen.active{display:block}
  .btn{width:100%;padding:16px;background:#fff;color:#000;border:1px solid #fff;font-family:inherit;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;margin-bottom:10px}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:transparent;color:#fff}
  .btn.sm{padding:11px;font-size:11px;letter-spacing:1px}
  .btn.danger{background:transparent;color:#ff4444;border-color:#ff4444}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#777;margin-bottom:7px}
  .field input,.field select{width:100%;padding:15px;background:#0d0d0d;border:1px solid #222;color:#fff;font-family:inherit;font-size:15px;outline:none}
  .field input:focus,.field select:focus{border-color:#fff}
  .field input.code{font-family:'SF Mono',monospace;font-size:26px;text-align:center;letter-spacing:8px;font-weight:700;padding-left:26px}
  .code-box{border:1px solid #fff;padding:24px 18px;text-align:center;margin:16px 0}
  .code-box .lbl{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#777;margin-bottom:10px}
  .code-box .code{font-family:'SF Mono',monospace;font-size:38px;font-weight:700;letter-spacing:6px;margin-bottom:16px}
  .code-tag{text-align:center;font-size:10px;letter-spacing:2px;color:#666;padding:4px 0 0;text-transform:uppercase}
  .code-tag .code-num{color:#fff;font-weight:700;font-family:'SF Mono',monospace;font-size:13px}
  .status{text-align:center;font-size:12px;color:#888;padding:8px;letter-spacing:1px}
  .status .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ff4444;margin-right:6px}
  .status .dot.on{background:#44ff88}
  .board{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:340px;margin:20px auto;aspect-ratio:1}
  .cell{background:#0d0d0d;border:2px solid #222;display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:700;cursor:pointer;user-select:none}
  .cell:active{border-color:#fff}
  .cell.X{color:#5aa0e0}
  .cell.O{color:#e05a5a}
  .msg{text-align:center;padding:14px;font-size:13px;letter-spacing:1px;color:#888;line-height:1.5}
  .big{text-align:center;padding:8px;font-size:15px;font-weight:700;letter-spacing:2px}
  .player-row{display:flex;justify-content:space-between;align-items:center;padding:5px 9px;border:1px solid #1a1a1a;margin-bottom:3px;font-size:12px;background:#0d0d0d;border-radius:6px}
  .player-row.me{border-color:#3d6fa5}
  .player-row.attacker{border-left:3px solid #ff8c00}
  .player-row.defender{border-left:3px solid #dc3d3d}
  .player-row.left{opacity:.4;text-decoration:line-through}
  .badge{font-size:8px;letter-spacing:1px;padding:1px 5px;border-radius:3px;background:#222;margin-left:4px}
  .badge.a{background:#ff8c00;color:#000}
  .badge.d{background:#dc3d3d;color:#fff}
  .timer-bar{height:4px;background:#1a1a1a;border-radius:3px;overflow:hidden;margin:0 auto 8px;max-width:300px}
  .timer-fill{height:100%;background:#44ff88;transition:width 0.2s linear,background 0.3s}
  .timer-fill.warn{background:#ffaa00}
  .timer-fill.danger{background:#ff4444}
  .chat{overflow-y:auto;border:1px solid #1a1a1a;padding:8px;margin-bottom:6px;font-size:12px;background:#0d0d0d;border-radius:6px}
  .chat .m{margin-bottom:6px;line-height:1.35}
  .chat .m .u{color:#777;font-size:10px;font-family:'SF Mono',monospace}
  .chat .m .x{color:#fff}
  .chat-input{display:flex;gap:6px}
  .chat-input input{flex:1;background:#0d0d0d;border:1px solid #222;color:#fff;padding:10px 11px;font-size:13px;font-family:inherit;outline:none;border-radius:6px}
  .chat-input button{background:#fff;color:#000;border:none;padding:0 14px;font-weight:700;cursor:pointer;font-family:inherit;border-radius:6px}
  .sect{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#666;margin-bottom:5px;margin-top:6px}
  .info-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0;padding:5px 9px;background:#0d0d0d;border:1px solid #1a1a1a;border-radius:6px}
  .info-row .trump-label{font-size:9px;letter-spacing:2px;color:#ffd23d;font-weight:700}
  .info-row .trump-card{font-size:19px;font-weight:900;font-family:'SF Mono',monospace;line-height:1;padding:2px 9px;border-radius:6px;background:#000;border:2px solid #ffd23d}
  .info-row .trump-card.red{color:#e05a5a}
  .info-row .trump-card.black{color:#fff}
  .info-row .counts{font-size:11px;color:#888}
  .info-row .counts b{color:#fff;font-weight:700}
  .lastlog{font-size:11px;color:#888;text-align:center;padding:3px 0 6px;min-height:14px;font-style:italic}
  .divider{height:1px;background:#1a1a1a;margin:16px 0}
  .back-btn{background:transparent;border:none;color:#666;font-size:12px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;font-family:inherit;padding:8px 0;margin-bottom:8px}
  .back-btn:active{color:#fff}

  #s-durakGame{padding:0;display:none;flex-direction:column;height:100vh;background:#000}
  #s-durakGame.active{display:flex}
  .durak-top{padding:6px 10px 0;flex-shrink:0}
  .durak-mid{flex:1;overflow-y:auto;padding:0 10px;min-height:0}
  .durak-bottom{flex-shrink:0;padding:6px 10px 10px;background:#000;border-top:1px solid #1a1a1a}

  #s-spyGame{padding:0;display:none;flex-direction:column;height:100vh;background:#000}
  #s-spyGame.active{display:flex}
  .spy-top{padding:6px 10px 0;flex-shrink:0}
  .spy-mid{flex:1;overflow-y:auto;padding:0 10px;min-height:0}
  .spy-bottom{flex-shrink:0;padding:6px 10px 10px;background:#000;border-top:1px solid #1a1a1a}

  .game-tabs{display:flex;background:#000;border-top:1px solid #1a1a1a;border-bottom:1px solid #1a1a1a;flex-shrink:0}
  .game-tab{flex:1;padding:10px 6px;text-align:center;background:transparent;border:none;color:#666;font-family:inherit;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;position:relative}
  .game-tab.active{color:#fff;border-bottom:2px solid #fff}
  .game-tab .unread{display:inline-block;background:#ff4444;color:#fff;border-radius:8px;padding:1px 6px;font-size:10px;margin-left:4px;font-weight:700}
  .game-tab-body{display:none;flex:1;min-height:0;flex-direction:column}
  .game-tab-body.active{display:flex}
  .chat-full{flex:1;overflow-y:auto;padding:10px;font-size:13px;background:#0d0d0d;border:none;border-radius:0}
  .chat-full .m{margin-bottom:8px;line-height:1.4}
  .chat-full .m .u{color:#777;font-size:11px;font-family:'SF Mono',monospace}
  .chat-full .m .x{color:#fff}
  .chat-full-input{display:flex;gap:6px;padding:8px 10px;background:#000;border-top:1px solid #1a1a1a;flex-shrink:0}
  .chat-full-input input{flex:1;background:#0d0d0d;border:1px solid #222;color:#fff;padding:10px 11px;font-size:14px;font-family:inherit;outline:none;border-radius:6px}
  .chat-full-input button{background:#fff;color:#000;border:none;padding:0 16px;font-weight:700;cursor:pointer;font-family:inherit;border-radius:6px}

  .hidden{display:none!important}
</style>
</head>
<body>
<div class="top"><h1>ИГРЫ</h1></div>

<div id="s-menu" class="screen active">
  <button class="btn" onclick="go('create')">❌ КРЕСТИКИ-НОЛИКИ</button>
  <button class="btn" onclick="go('durakCreate')">🃏 ДУРАК</button>
  <button class="btn" onclick="go('spyCreate')">🕵️ ШПИОН</button>
</div>

<div id="s-create" class="screen">
  <button class="back-btn" onclick="go('menu')">← НАЗАД</button>
  <div id="createForm">
    <div class="field"><label>Ваше имя</label><input id="createName" type="text" placeholder="Игрок"></div>
    <button class="btn" onclick="createRoom()">СОЗДАТЬ КОМНАТУ</button>
    <div class="divider"></div>
    <button class="btn ghost" onclick="go('join')">ВОЙТИ ПО КОДУ</button>
  </div>
  <div id="createResult" style="display:none">
    <div class="code-box">
      <div class="lbl">КОД — ПЕРЕДАЙ ДРУГУ</div>
      <div class="code" id="newCode">000000</div>
      <button class="btn ghost" onclick="copyCode()" id="copyBtn">СКОПИРОВАТЬ</button>
    </div>
    <button class="btn" onclick="enterRoom()">ВОЙТИ В ИГРУ</button>
  </div>
</div>
<div id="s-join" class="screen">
  <button class="back-btn" onclick="go('create')">← НАЗАД</button>
  <div class="field"><label>Ваше имя</label><input id="joinName" type="text" placeholder="Игрок"></div>
  <div class="field"><label>Код комнаты</label><input id="joinCode" type="tel" inputmode="numeric" maxlength="6" class="code" placeholder="000000"></div>
  <button class="btn" onclick="joinRoom()">ВОЙТИ</button>
</div>
<div id="s-game" class="screen">
  <div class="status"><span class="dot" id="wsDot"></span><span id="wsStatus">ПОДКЛЮЧЕНИЕ...</span></div>
  <div class="code-tag">КОД КОМНАТЫ: <span class="code-num" id="tttCodeTag">------</span></div>
  <div class="big" id="turnInfo">—</div>
  <div class="timer-bar" id="tttTimerBar" style="display:none"><div class="timer-fill" id="tttTimerFill" style="width:100%"></div></div>
  <div class="board" id="board"></div>
  <div class="msg" id="result"></div>
  <button class="btn danger" onclick="tttSurrender()" id="tttSurrenderBtn">СДАТЬСЯ</button>
  <button class="btn ghost" onclick="resetGame()">НОВАЯ ПАРТИЯ</button>
  <button class="btn ghost" onclick="location.reload()">ВЫЙТИ</button>
</div>

<div id="s-durakCreate" class="screen">
  <button class="back-btn" onclick="go('menu')">← НАЗАД</button>
  <div id="durakCreateForm">
    <div class="field"><label>Ваше имя</label><input id="durakName" type="text" placeholder="Игрок"></div>
    <div class="field"><label>Игроков</label>
      <select id="durakMaxPlayers">
        <option value="2">2 игрока (1 на 1)</option>
        <option value="3">3 игрока</option>
        <option value="4">4 игрока</option>
        <option value="5">5 игроков</option>
        <option value="6">6 игроков</option>
      </select>
    </div>
    <div class="field"><label>Колода</label>
      <select id="durakDeck">
        <option value="36">36 карт (6–Туз)</option>
        <option value="52">52 карты (2–Туз)</option>
      </select>
    </div>
    <div class="field"><label>Время на ход</label>
      <select id="durakTurnLimit">
        <option value="15">15 секунд</option>
        <option value="30" selected>30 секунд</option>
        <option value="45">45 секунд</option>
        <option value="60">60 секунд</option>
        <option value="90">90 секунд</option>
      </select>
    </div>
    <div class="field">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;text-transform:none">
        <input type="checkbox" id="durakTranslate" style="width:auto"> Переводной
      </label>
    </div>
    <button class="btn" onclick="durakCreate()">СОЗДАТЬ КОМНАТУ</button>
    <div class="divider"></div>
    <button class="btn ghost" onclick="go('durakJoin')">ВОЙТИ ПО КОДУ</button>
  </div>
  <div id="durakCreateResult" style="display:none">
    <div class="code-box">
      <div class="lbl">КОД — ПЕРЕДАЙ ДРУЗЬЯМ</div>
      <div class="code" id="durakCode">000000</div>
      <button class="btn ghost" onclick="durakCopy()" id="durakCopyBtn">СКОПИРОВАТЬ</button>
    </div>
    <div class="msg" id="durakWaitingMsg">Ждём игроков...</div>
    <button class="btn" onclick="durakEnter()">ВОЙТИ В ЛОББИ</button>
  </div>
</div>
<div id="s-durakJoin" class="screen">
  <button class="back-btn" onclick="go('durakCreate')">← НАЗАД</button>
  <div class="field"><label>Ваше имя</label><input id="durakJoinName" type="text" placeholder="Игрок"></div>
  <div class="field"><label>Код комнаты</label><input id="durakJoinCode" type="tel" inputmode="numeric" maxlength="6" class="code" placeholder="000000"></div>
  <button class="btn" onclick="durakJoin()">ВОЙТИ</button>
</div>

<div id="s-durakGame">
  <div class="durak-top">
    <div class="status"><span class="dot" id="durakDot"></span><span id="durakStatus">ПОДКЛЮЧЕНИЕ...</span></div>
    <div class="code-tag" style="padding-bottom:4px">КОД КОМНАТЫ: <span class="code-num" id="durakCodeTag">------</span></div>
    <div class="big" id="durakInfo">—</div>
    <div class="timer-bar" id="durakTimerBar" style="display:none"><div class="timer-fill" id="durakTimerFill" style="width:100%"></div></div>
    <div class="info-row">
      <div style="display:flex;align-items:center;gap:8px">
        <span class="trump-label">КОЗЫРЬ</span>
        <span class="trump-card" id="durakTrumpCard">—</span>
      </div>
      <div class="counts">Колода: <b id="durakDeckCount">0</b> · В игре: <b id="durakPlayersCount">0</b></div>
    </div>
  </div>

  <div class="game-tabs">
    <button class="game-tab active" data-tab="game" onclick="durakSwitchTab('game')">🎴 Игра</button>
    <button class="game-tab" data-tab="chat" onclick="durakSwitchTab('chat')">💬 Чат <span class="unread" id="durakChatBadge" style="display:none">0</span></button>
  </div>

  <div class="game-tab-body active" id="durak-body-game">
    <div class="durak-mid">
      <div class="sect">ИГРОКИ</div>
      <div id="durakPlayers" style="margin-bottom:6px"></div>
      <div class="sect">СТОЛ</div>
      <div id="durakTable" style="min-height:80px;display:flex;flex-wrap:wrap;gap:8px;padding:8px;background:#0d0d0d;border:1px solid #1a1a1a;border-radius:6px;margin-bottom:6px"></div>
      <div class="lastlog" id="durakLastLog"></div>
      <div class="sect">ВАША РУКА</div>
      <div id="durakHand" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px"></div>
    </div>
    <div class="durak-bottom">
      <div style="display:flex;gap:6px;margin-bottom:6px">
        <button class="btn sm" id="durakStartBtn" style="flex:1;display:none;margin:0" onclick="durakStartGame()">НАЧАТЬ ИГРУ</button>
        <button class="btn sm" id="durakPassBtn" style="flex:1;display:none;margin:0" onclick="durakAction('pass')">БИТО</button>
        <button class="btn sm" id="durakTakeBtn" style="flex:1;display:none;margin:0" onclick="durakAction('take')">ВЗЯТЬ</button>
      </div>
      <div style="display:flex;gap:6px">
        <button class="btn sm danger" id="durakSurrenderBtn" style="flex:1;margin:0" onclick="durakSurrender()">СДАТЬСЯ</button>
        <button class="btn sm ghost" style="flex:1;margin:0" onclick="location.reload()">ВЫЙТИ</button>
      </div>
    </div>
  </div>

  <div class="game-tab-body" id="durak-body-chat">
    <div class="chat-full" id="durakChatBox"></div>
    <div class="chat-full-input">
      <input id="durakChatInput" type="text" placeholder="Написать..." maxlength="300">
      <button onclick="durakChat()">→</button>
    </div>
  </div>
</div>

<div id="s-spyCreate" class="screen">
  <button class="back-btn" onclick="go('menu')">← НАЗАД</button>
  <div id="spyCreateForm">
    <div class="field"><label>Ваше имя</label><input id="spyName" type="text" placeholder="Игрок"></div>
    <div class="field"><label>Пак слов</label><select id="spyPack"></select></div>
    <button class="btn" onclick="spyCreate()">СОЗДАТЬ КОМНАТУ</button>
    <div class="divider"></div>
    <button class="btn ghost" onclick="go('spyJoin')">ВОЙТИ ПО КОДУ</button>
  </div>
  <div id="spyCreateResult" style="display:none">
    <div class="code-box">
      <div class="lbl">КОД — ПЕРЕДАЙ ДРУЗЬЯМ</div>
      <div class="code" id="spyCode">000000</div>
      <button class="btn ghost" onclick="spyCopy()" id="spyCopyBtn">СКОПИРОВАТЬ</button>
    </div>
    <button class="btn" onclick="spyEnter()">ВОЙТИ В ЛОББИ</button>
  </div>
</div>
<div id="s-spyJoin" class="screen">
  <button class="back-btn" onclick="go('spyCreate')">← НАЗАД</button>
  <div class="field"><label>Ваше имя</label><input id="spyJoinName" type="text" placeholder="Игрок"></div>
  <div class="field"><label>Код комнаты</label><input id="spyJoinCode" type="tel" inputmode="numeric" maxlength="6" class="code" placeholder="000000"></div>
  <button class="btn" onclick="spyJoin()">ВОЙТИ</button>
</div>

<div id="s-spyGame">
  <div class="spy-top">
    <div class="status"><span class="dot" id="spyDot"></span><span id="spyStatus">ПОДКЛЮЧЕНИЕ...</span></div>
    <div class="code-tag" style="padding-bottom:4px">КОД КОМНАТЫ: <span class="code-num" id="spyCodeTag">------</span></div>
    <div class="big" id="spyPhase">—</div>
    <div class="timer-bar" id="spyTimerBar" style="display:none"><div class="timer-fill" id="spyTimerFill" style="width:100%"></div></div>
  </div>

  <div class="game-tabs">
    <button class="game-tab active" data-tab="game" onclick="spySwitchTab('game')">🎮 Игра</button>
    <button class="game-tab" data-tab="chat" onclick="spySwitchTab('chat')">💬 Чат <span class="unread" id="spyChatBadge" style="display:none">0</span></button>
  </div>

  <div class="game-tab-body active" id="spy-body-game">
    <div class="spy-mid">
      <div style="border:1px solid #fff;padding:10px;text-align:center;margin:6px 0;background:#0d0d0d;border-radius:8px">
        <div style="font-size:9px;letter-spacing:2px;color:#888;text-transform:uppercase;margin-bottom:4px">ВАШЕ СЛОВО</div>
        <div id="spyMyWord" style="font-size:20px;font-weight:700">—</div>
      </div>
      <div id="spyResultBox" style="display:none;border:1px solid #444;padding:10px;margin:6px 0;background:#0d0d0d;border-radius:8px;font-size:13px"></div>
      <div class="sect">ИГРОКИ</div>
      <div id="spyPlayers" style="margin-bottom:6px"></div>
    </div>
    <div class="spy-bottom">
      <div style="display:flex;gap:6px;margin-bottom:6px">
        <button class="btn sm" id="spyStartBtn" style="flex:1;display:none;margin:0" onclick="spyStartGame()">НАЧАТЬ</button>
        <button class="btn sm" id="spyVoteBtn" style="flex:1;display:none;margin:0" onclick="spyToVote()">К ГОЛОСОВАНИЮ</button>
        <button class="btn sm" id="spyFinishBtn" style="flex:1;display:none;margin:0" onclick="spyFinishVote()">ЗАВЕРШИТЬ</button>
        <button class="btn sm" id="spyResetBtn" style="flex:1;display:none;margin:0" onclick="spyReset()">НОВАЯ ИГРА</button>
      </div>
      <button class="btn sm ghost" style="width:100%;margin:0" onclick="location.reload()">ВЫЙТИ</button>
    </div>
  </div>

  <div class="game-tab-body" id="spy-body-chat">
    <div class="chat-full" id="spyChatBox"></div>
    <div class="chat-full-input">
      <input id="spyChatInput" type="text" placeholder="Написать..." maxlength="300">
      <button onclick="spyChat()">→</button>
    </div>
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();
const USER_ID = tg?.initDataUnsafe?.user?.id || Date.now();
let USERNAME = 'guest' + String(USER_ID).slice(-4);

function go(s) {
  document.querySelectorAll('.screen').forEach(x => x.classList.remove('active'));
  document.getElementById('s-' + s).classList.add('active');
  if (s !== 'durakGame' && s !== 'spyGame') window.scrollTo(0, 0);
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

// ═══════════════ КРЕСТИКИ ═══════════════
let ws = null, code = null, mySymbol = null, board = [], turn = 'X', winner = null, myTurn = false;
let tttDeadline = null, tttTick = null, tttTimeoutSent = false;

async function createRoom() {
  USERNAME = document.getElementById('createName').value.trim() || USERNAME;
  const r = await fetch('/api/room/create', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:USER_ID,username:USERNAME})});
  const d = await r.json();
  if (!d.ok) { tg?.showAlert?.(d.error); return; }
  code = d.code;
  document.getElementById('newCode').textContent = d.code;
  document.getElementById('createForm').style.display = 'none';
  document.getElementById('createResult').style.display = 'block';
}
function copyCode(){const c=document.getElementById('newCode').textContent;navigator.clipboard.writeText(c).then(()=>{const b=document.getElementById('copyBtn');b.textContent='СКОПИРОВАНО ✓';setTimeout(()=>b.textContent='СКОПИРОВАТЬ',1500)});}
function enterRoom(){if(code)startGame();}
async function joinRoom(){
  USERNAME = document.getElementById('joinName').value.trim() || USERNAME;
  const c = document.getElementById('joinCode').value.trim();
  if (c.length !== 6) { tg?.showAlert?.('Код из 6 цифр'); return; }
  const r = await fetch('/api/room/join', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:c,user_id:USER_ID,username:USERNAME})});
  const d = await r.json();
  if (!d.ok) { tg?.showAlert?.(d.error); return; }
  code = c; startGame();
}
function startGame(){go('game');document.getElementById('tttCodeTag').textContent=code||'------';renderBoard();connectWS();startTttTick();}
function renderBoard(){const b=document.getElementById('board');b.innerHTML='';for(let i=0;i<9;i++){const cell=document.createElement('div');cell.className='cell '+(board[i]||'');cell.textContent=board[i]||'';cell.onclick=()=>clickCell(i);b.appendChild(cell);}}
function clickCell(i){if(!myTurn||winner||board[i]||!ws||ws.readyState!==1)return;ws.send(JSON.stringify({type:'move',index:i}));}
function connectWS(){const proto=location.protocol==='https:'?'wss':'ws';ws=new WebSocket(`${proto}://${location.host}/ws/game/${code}?uid=${USER_ID}`);ws.onopen=()=>setDot(true);ws.onclose=()=>setDot(false);ws.onerror=()=>setDot(false);ws.onmessage=e=>handleWS(JSON.parse(e.data));}
function setDot(on){document.getElementById('wsDot').classList.toggle('on',on);document.getElementById('wsStatus').textContent=on?'В СЕТИ':'НЕТ СВЯЗИ';}
function handleWS(msg){
  if(msg.type==='init'){mySymbol=msg.symbol;board=msg.state.board;turn=msg.state.turn;winner=msg.state.winner;tttApplyDeadline(msg.turn_remaining);updateUI();renderBoard();}
  else if(msg.type==='state'){board=msg.board;turn=msg.turn;winner=msg.winner;if(msg.turn_remaining!==undefined)tttApplyDeadline(msg.turn_remaining);if(msg.winner)tttDeadline=null;updateUI();renderBoard();}
  else if(msg.type==='error'){document.getElementById('turnInfo').textContent=msg.error;}
}
function tttApplyDeadline(rem){tttTimeoutSent=false;if(rem===undefined||rem===null||rem===0||winner){tttDeadline=null;return;}tttDeadline=Date.now()+rem*1000;}
function startTttTick(){
  if(tttTick) clearInterval(tttTick);
  tttTick=setInterval(()=>{
    const bar=document.getElementById('tttTimerBar');const fill=document.getElementById('tttTimerFill');
    if(!bar||!fill) return;
    if(winner||!tttDeadline){bar.style.display='none';return;}
    bar.style.display='block';
    const rem=Math.max(0,(tttDeadline-Date.now())/1000);
    const pct=Math.max(0,Math.min(100,(rem/15)*100));
    fill.style.width=pct+'%';
    fill.classList.toggle('warn',pct<60&&pct>=30);
    fill.classList.toggle('danger',pct<30);
    if(rem<=0 && !tttTimeoutSent && myTurn){tttTimeoutSent=true;ws?.send?.(JSON.stringify({type:'timeout'}));}
  },200);
}
function updateUI(){
  myTurn=(turn===mySymbol)&&!winner;
  const el=document.getElementById('turnInfo');const res=document.getElementById('result');
  const sb=document.getElementById('tttSurrenderBtn');
  if(sb) sb.style.display=(winner||!mySymbol)?'none':'block';
  if(winner==='draw'){el.textContent='НИЧЬЯ';res.textContent='';}
  else if(winner){el.textContent=winner===mySymbol?'🏆 ПОБЕДА':'💀 ПОРАЖЕНИЕ';res.textContent='';}
  else if(myTurn){el.textContent='ВАШ ХОД';res.textContent='Вы — '+mySymbol;}
  else{el.textContent='ЖДЁМ ПРОТИВНИКА...';res.textContent='Вы — '+(mySymbol||'?');}
}
function resetGame(){if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'reset'}));}
function tttSurrender(){if(!ws||ws.readyState!==1||winner)return;if(!confirm('Сдаться?'))return;ws.send(JSON.stringify({type:'surrender'}));}

// ═══════════════ ДУРАК ═══════════════
const RANK_NAMES={6:'6',7:'7',8:'8',9:'9',10:'10',11:'В',12:'Д',13:'К',14:'Т'};
const SUIT_NAMES={h:'♥',d:'♦',c:'♣',s:'♠'};
let durakWs=null,durakRoom=null,durakState=null;
let durakUnread=0, durakActiveTab='game', durakLastChatLen=0;
let durakDeadline = null, durakTick = null;

function durakSwitchTab(tab){
  durakActiveTab=tab;
  document.querySelectorAll('#s-durakGame .game-tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  document.getElementById('durak-body-game').classList.toggle('active',tab==='game');
  document.getElementById('durak-body-chat').classList.toggle('active',tab==='chat');
  if(tab==='chat'){
    durakUnread=0;
    durakUpdateBadge();
    if(durakState) durakLastChatLen=(durakState.chat||[]).length;
    durakRender();
  }
}
function durakUpdateBadge(){
  const el=document.getElementById('durakChatBadge');
  if(!el)return;
  if(durakUnread>0){el.textContent=durakUnread;el.style.display='inline-block';}
  else el.style.display='none';
}

function updateDurakTimer(){
  const s = durakState; if(!s) return;
  const bar=document.getElementById('durakTimerBar'); const fill=document.getElementById('durakTimerFill');
  if(!bar || !fill) return;
  const iAmOut = s.your_left;
  if(s.phase==='waiting'||s.phase==='over'||iAmOut||!durakDeadline){
    bar.style.display='none';
    return;
  }
  const total = s.turn_limit || 30;
  const rem = Math.max(0, (durakDeadline - Date.now()) / 1000);
  const pct = Math.max(0, Math.min(100, (rem / total) * 100));
  bar.style.display='block';
  fill.style.width = pct + '%';
  fill.classList.toggle('warn', pct < 60 && pct >= 30);
  fill.classList.toggle('danger', pct < 30);
}
function startDurakTick(){
  if(durakTick) clearInterval(durakTick);
  durakTick = setInterval(updateDurakTimer, 200);
}

function durakCopy(){const c=document.getElementById('durakCode').textContent;navigator.clipboard.writeText(c).then(()=>{const b=document.getElementById('durakCopyBtn');b.textContent='СКОПИРОВАНО ✓';setTimeout(()=>b.textContent='СКОПИРОВАТЬ',1500)});}
function durakEnter(){if(durakRoom)durakStart();}
async function durakJoin(){
  const name=document.getElementById('durakJoinName').value.trim()||USERNAME;
  const c=document.getElementById('durakJoinCode').value.trim();
  if(c.length!==6){tg?.showAlert?.('Код из 6 цифр');return;}

  durakRoom=c;durakStart();
}
function durakStart(){go('durakGame');document.getElementById('durakCodeTag').textContent=durakRoom||'------';startDurakTick();const proto=location.protocol==='https:'?'wss':'ws';durakWs=new WebSocket(`${proto}://${location.host}/ws/durak/${durakRoom}?uid=${USER_ID}`);durakWs.onopen=()=>durakDot(true);durakWs.onclose=()=>durakDot(false);durakWs.onmessage=e=>durakHandle(JSON.parse(e.data));}
function durakDot(on){document.getElementById('durakDot').classList.toggle('on',on);document.getElementById('durakStatus').textContent=on?'В СЕТИ':'НЕТ СВЯЗИ';}
function durakHandle(msg){if(msg.type==='state'){durakState=msg.state;durakRender();}else if(msg.type==='error'){tg?.showAlert?.(msg.error);}}
function durakCardEl(c,clickable){const red=c.s==='h'||c.s==='d';const color=red?'#e05a5a':'#fff';return `<div data-r="${c.r}" data-s="${c.s}" style="width:52px;height:74px;border:2px solid #222;border-radius:8px;background:#1a1a2e;color:${color};display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:17px;line-height:1.1;cursor:${clickable?'pointer':'default'};user-select:none;flex-shrink:0;gap:1px"><div>${RANK_NAMES[c.r]}</div><div style="font-size:19px">${SUIT_NAMES[c.s]}</div></div>`;}
function durakRender(){
  const s=durakState;if(!s)return;
  const myIdx=s.your_idx;const isMyAttack=myIdx===s.attacker_idx;const isMyDefense=myIdx===s.defender_idx&&s.phase==='defend';const iAmOut=s.your_left;
  let info='—';
  if(s.phase==='waiting')info=`ЖДЁМ ИГРОКОВ (${s.players.length}/${s.max_players})`;
  else if(s.phase==='over'){if(s.is_draw)info='🤝 НИЧЬЯ';else if(s.durak_id===USER_ID)info='💀 ВЫ ДУРАК';else info='🏆 ВЫ ПОБЕДИЛИ';}
  else if(iAmOut)info='✅ ВЫ ВЫШЛИ ИЗ ИГРЫ';
  else if(isMyDefense)info='🛡 ВАША ЗАЩИТА';
  else if(isMyAttack&&s.table.length===0)info='⚔ ВАШ ХОД — АТАКА';
  else if(isMyAttack&&s.phase==='attack')info='⚔ ПОДКИНЬТЕ ИЛИ ЖМИТЕ БИТО';
  else info='⏳ ЖДЁМ ХОДА';
  document.getElementById('durakInfo').textContent=info;

  // Таймер: обновляем deadline и запускаем плавный тик
  if(s.phase==='waiting'||s.phase==='over'||iAmOut){
    durakDeadline = null;
  } else if (s.turn_remaining !== undefined && s.turn_remaining !== null) {
    durakDeadline = Date.now() + s.turn_remaining * 1000;
  }
  updateDurakTimer();

  if(s.trump_card){
    const tc=document.getElementById('durakTrumpCard');
    tc.textContent=RANK_NAMES[s.trump_card.r]+SUIT_NAMES[s.trump];
    tc.classList.toggle('red',s.trump==='h'||s.trump==='d');
    tc.classList.toggle('black',!(s.trump==='h'||s.trump==='d'));
  }
  document.getElementById('durakDeckCount').textContent=s.deck_count;
  document.getElementById('durakPlayersCount').textContent=s.players.filter(p=>!p.left).length;

  const lastLog=(s.log||[]).length?(s.log||[])[(s.log||[]).length-1]:'';
  document.getElementById('durakLastLog').textContent=lastLog;

  const pl=document.getElementById('durakPlayers');
  pl.innerHTML=(s.players||[]).map(p=>{const me=p.seat===myIdx;const cls=['player-row'];if(me)cls.push('me');if(p.is_attacker)cls.push('attacker');if(p.is_defender)cls.push('defender');if(p.left)cls.push('left');const badges=(p.is_attacker?'<span class="badge a">АТАКА</span>':'')+(p.is_defender?'<span class="badge d">ЗАЩИТА</span>':'');return `<div class="${cls.join(' ')}"><div>${me?'👉 ':''}${escapeHtml(p.name)} ${badges}</div><div>🃏 ${p.hand_count}${p.left?' 🏳️':''}</div></div>`;}).join('');

  const table=document.getElementById('durakTable');
  if(s.table.length===0)table.innerHTML='<div style="color:#555;font-size:11px;padding:10px">Пусто</div>';
  else table.innerHTML=s.table.map(pair=>`<div style="display:flex">${durakCardEl(pair.attack,false)}${pair.defend?`<div style="margin-left:-20px;transform:rotate(15deg)">${durakCardEl(pair.defend,false)}</div>`:''}</div>`).join('');

  const hand=document.getElementById('durakHand');
  const canPlay=!iAmOut&&s.phase!=='over'&&s.phase!=='waiting';
  hand.innerHTML=(s.your_hand||[]).map(c=>durakCardEl(c,canPlay)).join('');
  hand.querySelectorAll('[data-r]').forEach(el=>{
    el.onclick=()=>{
      if(!canPlay)return;
      const r=parseInt(el.dataset.r,10);const suit=el.dataset.s;const card={r,s:suit};
      if(isMyDefense){
        if(s.opts.translate&&s.table.length===1&&!s.table[0].defend&&s.table[0].attack.r===r)durakAction('translate',card);
        else durakAction('defend',card);
      }else if(isMyAttack||(s.table.length>0&&myIdx!==s.defender_idx)){durakAction('attack',card);}
    };
  });

  const chatLen=(s.chat||[]).length;
  if(chatLen>durakLastChatLen){
    const diff=chatLen-durakLastChatLen;
    if(durakActiveTab!=='chat'){durakUnread+=diff;durakUpdateBadge();}
  }
  durakLastChatLen=chatLen;

  const chatBox=document.getElementById('durakChatBox');
  if(chatBox){
    const atBottom=chatBox.scrollTop+chatBox.clientHeight>=chatBox.scrollHeight-20;
    chatBox.innerHTML=(s.chat||[]).map(m=>`<div class="m"><div class="u">${escapeHtml(m.user)}</div><div class="x">${escapeHtml(m.text)}</div></div>`).join('');
    if(atBottom)chatBox.scrollTop=chatBox.scrollHeight;
  }

  const startBtn=document.getElementById('durakStartBtn');const passBtn=document.getElementById('durakPassBtn');const takeBtn=document.getElementById('durakTakeBtn');const surBtn=document.getElementById('durakSurrenderBtn');
  startBtn.style.display=(s.phase==='waiting'&&myIdx===0)?'block':'none';
  passBtn.style.display=(isMyAttack&&s.phase==='attack'&&s.table.length>0)?'block':'none';
  takeBtn.style.display=(isMyDefense&&s.phase==='defend')?'block':'none';
  if(surBtn) surBtn.style.display=(s.phase==='over'||iAmOut||s.phase==='waiting')?'none':'block';
}
async function durakStartGame(){const r=await fetch('/api/durak/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:durakRoom,user_id:USER_ID})});const d=await r.json();if(!d.ok)tg?.showAlert?.(d.error);}
function durakAction(action,card){if(!durakWs||durakWs.readyState!==1)return;durakWs.send(JSON.stringify({action,card}));}
function durakChat(){const i=document.getElementById('durakChatInput');const t=i.value.trim();if(!t)return;durakWs?.send?.(JSON.stringify({action:'chat',text:t}));i.value='';}
function durakSurrender(){if(!durakWs||durakWs.readyState!==1)return;const s=durakState;if(!s||s.your_left||s.phase==='over')return;if(!confirm('Сдаться? Вы выйдете из игры.'))return;durakWs.send(JSON.stringify({action:'surrender'}));}

function spyRender(){
  const s=spyState;if(!s)return;
  const labels={waiting:`ЛОББИ (${s.players.length}/15)`,discuss:'🗣 ОБСУЖДАЙТЕ — КТО ШПИОН?',vote:'🗳 ГОЛОСОВАНИЕ',result:'🏁 РЕЗУЛЬТАТ'};
  document.getElementById('spyPhase').textContent=labels[s.phase]||'—';
  const bar=document.getElementById('spyTimerBar');const fill=document.getElementById('spyTimerFill');
  if(s.phase==='vote'){bar.style.display='block';const pct=Math.max(0,Math.min(100,(s.vote_remaining/90)*100));fill.style.width=pct+'%';fill.classList.toggle('warn',pct<60&&pct>=30);fill.classList.toggle('danger',pct<30);}
  else bar.style.display='none';
  const pl=document.getElementById('spyPlayers');
  pl.innerHTML=s.players.map(p=>{
    const me=p.is_me;const cls=['player-row'];if(me)cls.push('me');
    const voteMark=s.phase==='vote'?(p.has_voted?' ✅':' ⏳'):'';
    const clickable=s.phase==='vote'&&!me;
    return `<div class="${cls.join(' ')}" ${clickable?`data-vote="${p.user_id}"`:''} style="${clickable?'cursor:pointer':''}"><div>${me?'👉 ':''}${escapeHtml(p.name)}${voteMark}</div>${clickable?'<div style="font-size:10px;color:#f5c518">ГОЛОС →</div>':''}</div>`;
  }).join('');
  if(s.phase==='vote'){
    pl.querySelectorAll('[data-vote]').forEach(el=>{
      el.onclick=()=>{const target=parseInt(el.dataset.vote,10);spyWs?.send?.(JSON.stringify({type:'vote',target_id:target}));};
    });
  }
  const rbox=document.getElementById('spyResultBox');
  if(s.result){
    const r=s.result;
    const winnerText=r.spy_caught?'🏆 <b>Мирные победили!</b>':'🎭 <b>Шпион победил!</b>';
    let votesText='';
    for(const [tid,names] of Object.entries(r.votes||{})){
      const targetName=(s.players.find(p=>String(p.user_id)===String(tid))||{}).name||'?';
      votesText+=`<div style="font-size:12px;color:#aaa">${escapeHtml(targetName)}: ${names.length} гол. — ${names.map(n=>escapeHtml(n)).join(', ')}</div>`;
    }
    rbox.style.display='block';
    rbox.innerHTML=`${winnerText}<div style="margin-top:8px;font-size:14px">Шпион: <b>${escapeHtml(r.spy_name)}</b></div><div style="font-size:12px;color:#aaa;margin-bottom:6px">Общее слово: <b>${escapeHtml(r.common_word)}</b> · Слово шпиона: <b>${escapeHtml(r.spy_word)}</b></div><div style="font-size:11px;letter-spacing:1px;color:#777;margin-bottom:4px">ГОЛОСА:</div>${votesText}`;
  }else rbox.style.display='none';
  const isHost=s.host_id===USER_ID;
  document.getElementById('spyStartBtn').style.display=(s.phase==='waiting'&&isHost&&s.players.length>=3)?'block':'none';
  document.getElementById('spyVoteBtn').style.display=(s.phase==='discuss'&&isHost)?'block':'none';
  document.getElementById('spyFinishBtn').style.display=(s.phase==='vote'&&isHost)?'block':'none';
  document.getElementById('spyResetBtn').style.display=(s.phase==='result'&&isHost)?'block':'none';

  const chatLen=(s.chat||[]).length;
  if(chatLen>spyLastChatLen){
    const diff=chatLen-spyLastChatLen;
    if(spyActiveTab!=='chat'){spyUnread+=diff;spyUpdateBadge();}
  }
  spyLastChatLen=chatLen;

  const box=document.getElementById('spyChatBox');
  const atBottom=box.scrollTop+box.clientHeight>=box.scrollHeight-20;
  box.innerHTML=(s.chat||[]).map(m=>`<div class="m"><div class="u">${escapeHtml(m.user)}</div><div class="x">${escapeHtml(m.text)}</div></div>`).join('');
  if(atBottom)box.scrollTop=box.scrollHeight;
}
async function spyStartGame(){const r=await fetch('/api/spy/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:spyRoom,user_id:USER_ID})});const d=await r.json();if(!d.ok)tg?.showAlert?.(d.error);}
async function spyToVote(){const r=await fetch('/api/spy/to_vote',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:spyRoom,user_id:USER_ID})});const d=await r.json();if(!d.ok)tg?.showAlert?.(d.error);}
function spyFinishVote(){spyWs?.send?.(JSON.stringify({type:'finish_vote'}));}
function spyReset(){spyWs?.send?.(JSON.stringify({type:'reset'}));}
function spyChat(){const i=document.getElementById('spyChatInput');const t=i.value.trim();if(!t)return;spyWs?.send?.(JSON.stringify({type:'chat',text:t}));i.value='';}
