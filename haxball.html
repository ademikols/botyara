<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Haxball</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #1c1c1c; overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; touch-action: none;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }

  #s-menu {
    position: fixed; inset: 0;
    background: linear-gradient(180deg, #2a2a2a, #151515);
    color: #eee; overflow-y: auto; padding: 20px 16px 40px;
  }
  #s-menu h1 { text-align: center; color: #e8e000; margin: 10px 0 20px; font-size: 28px; letter-spacing: 2px; }
  .box { background: #232323; border: 1px solid #3a3a3a; border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  .box h2 { font-size: 14px; color: #aaa; margin: 0 0 10px; text-transform: uppercase; letter-spacing: 1px; }
  .row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .row label { flex: 1; min-width: 90px; }
  input[type=text], input[type=number] {
    width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #444;
    background: #111; color: #fff; font-size: 16px;
    -webkit-user-select: text; user-select: text;
  }
  .seg { display: flex; border-radius: 8px; overflow: hidden; border: 1px solid #444; }
  .seg button { flex: 1; padding: 10px 4px; background: #111; color: #ccc; border: none; font-size: 13px; border-right: 1px solid #333; }
  .seg button:last-child { border-right: none; }
  .seg button.active { background: #3a5fdc; color: #fff; }
  .big-btn { width: 100%; padding: 14px; border-radius: 10px; border: none; font-size: 16px; font-weight: bold; color: #fff; margin-top: 6px; }
  .btn-green { background: #2fa84f; }
  .btn-blue { background: #3a5fdc; }
  .btn-gray { background: #555; }
  .join-row { display: flex; gap: 8px; }
  .join-row input { flex: 1; }
  .join-row button { padding: 10px 16px; border-radius: 8px; border: none; background: #3a5fdc; color: #fff; font-weight: bold; }
  #list-items { margin-top: 6px; }
  .list-item { display: flex; justify-content: space-between; align-items: center; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 10px; margin-bottom: 6px; }
  .list-item .info { font-size: 13px; color: #bbb; }
  .list-item .name { font-size: 15px; color: #fff; font-weight: bold; }
  .list-item button { padding: 8px 14px; border-radius: 6px; border: none; background: #2fa84f; color: #fff; font-weight: bold; }
  .empty-hint { color: #666; font-size: 13px; text-align: center; padding: 10px; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: rgba(0,0,0,0.85); color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 14px; z-index: 999; opacity: 0; transition: opacity 0.25s; pointer-events: none; max-width: 85%; text-align: center; }
  #toast.show { opacity: 1; }

  #s-profile {
    position: fixed; inset: 0; display: none;
    background: linear-gradient(180deg, #2a2a2a, #151515);
    color: #eee; overflow-y: auto; padding: 20px 16px 40px;
    -webkit-overflow-scrolling: touch; touch-action: pan-y;
  }
  #s-profile h1 { text-align: center; color: #e8e000; margin: 10px 0 20px; font-size: 28px; letter-spacing: 2px; }
  .hint { color: #888; font-size: 12px; margin-top: 8px; }
  .stat-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid #333; font-size: 15px; color: #ccc; }
  .stat-row:last-child { border-bottom: none; }
  .stat-row b { color: #fff; font-size: 17px; }
  #btn-prof-back { margin-top: 10px; }

  #s-game { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #111; display: none; overflow: hidden; transform-origin: center center; }
  #gcanvas { display: block; background: #111; touch-action: none; }

  #joy-zone { position: absolute; left: 0; top: 0; width: 55%; height: 100%; z-index: 5; }
  #joy-base, #joy-stick { position: absolute; border-radius: 50%; display: none; pointer-events: none; }
  #joy-base { width: 100px; height: 100px; background: rgba(255,255,255,0.12); border: 2px solid rgba(255,255,255,0.3); }
  #joy-stick { width: 46px; height: 46px; background: rgba(255,255,255,0.45); border: 2px solid rgba(255,255,255,0.6); }
  #kick-btn { position: absolute; width: 110px; height: 110px; right: 18px; bottom: 18px; border-radius: 50%; background: #dc4040; opacity: 0.55; z-index: 6; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: bold; font-size: 16px; letter-spacing: 1px; border: 3px solid rgba(255,255,255,0.4); }
  #kick-btn.active { opacity: 0.9; }
  #exit-btn { position: absolute; top: 8px; right: 8px; padding: 6px 12px; background: rgba(0,0,0,0.5); color: #fff; border-radius: 8px; font-size: 12px; z-index: 7; }

  .act-btn { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); padding: 14px 34px; border-radius: 12px; border: 2px solid rgba(255,255,255,0.5); background: #2fa84f; color: #fff; font-size: 18px; font-weight: bold; letter-spacing: 1px; z-index: 8; display: none; }
  #rematch-btn { background: #3a5fdc; }
</style>
</head>
<body>

<div id="s-menu">
  <h1>HAXBALL</h1>
  <div class="box">
    <h2>Имя игрока</h2>
    <input type="text" id="in-name" maxlength="16" placeholder="Твоё имя">
  </div>
  <div class="box">
    <h2>Профиль</h2>
    <button class="big-btn btn-blue" id="btn-profile">МОЙ ПРОФИЛЬ</button>
  </div>
  <div class="box">
    <h2>Создать игру</h2>
    <div class="row"><input type="text" id="in-gamename" maxlength="24" placeholder="Название игры"></div>
    <div class="row"><label>Игроков</label></div>
    <div class="seg" id="seg-players">
      <button data-v="2">1v1</button>
      <button data-v="4" class="active">2v2</button>
      <button data-v="6">3v3</button>
    </div>
    <div class="row" style="margin-top:8px;"><label>Время матча</label></div>
    <div class="seg" id="seg-time">
      <button data-v="60">1 мин</button>
      <button data-v="120">2 мин</button>
      <button data-v="180" class="active">3 мин</button>
      <button data-v="300">5 мин</button>
    </div>
    <div class="row" style="margin-top:8px;"><label>Цвет поля</label></div>
    <div class="seg" id="seg-color">
      <button data-v="gray" class="active">Серый</button>
      <button data-v="green">Зелёный</button>
      <button data-v="blue">Синий</button>
      <button data-v="dark">Тёмный</button>
    </div>
    <div class="row" style="margin-top:8px;"><label>Скорость игроков</label></div>
    <div class="seg" id="seg-speed">
      <button data-v="80">80%</button>
      <button data-v="100" class="active">100%</button>
      <button data-v="120">120%</button>
    </div>
    <div class="row" style="margin-top:8px;"><label>Отскок мяча</label></div>
    <div class="seg" id="seg-bounce">
      <button data-v="low">Низкий</button>
      <button data-v="normal" class="active">Нормальный</button>
      <button data-v="high">Высокий</button>
    </div>
    <button class="big-btn btn-green" id="btn-create">СОЗДАТЬ ИГРУ</button>
  </div>
  <div class="box">
    <h2>Войти по коду</h2>
    <div class="join-row">
      <input type="text" id="in-code" maxlength="6" inputmode="numeric" placeholder="Код комнаты">
      <button id="btn-join">ВОЙТИ</button>
    </div>
  </div>
  <div class="box">
    <h2>Открытые игры</h2>
    <div id="list-items"></div>
  </div>
</div>

<div id="s-profile">
  <h1>МОЙ ПРОФИЛЬ</h1>
  <div class="box">
    <h2>Имя игрока</h2>
    <input type="text" id="in-prof-name" maxlength="16" placeholder="Твоё имя">
  </div>
  <div class="box">
    <h2>Номер на футболке</h2>
    <input type="number" id="in-prof-jersey" min="0" max="99" inputmode="numeric" placeholder="1-99">
    <div class="hint">0 — без номера, номер по позиции</div>
  </div>
  <div class="box">
    <h2>Статистика</h2>
    <div class="stat-row"><span>Матчей</span><b id="st-matches">0</b></div>
    <div class="stat-row"><span>Голов</span><b id="st-goals">0</b></div>
    <div class="stat-row"><span>Побед</span><b id="st-wins">0</b></div>
    <div class="stat-row"><span>Поражений</span><b id="st-losses">0</b></div>
    <div class="stat-row"><span>Ничьих</span><b id="st-draws">0</b></div>
  </div>
  <button class="big-btn btn-green" id="btn-prof-save">СОХРАНИТЬ</button>
  <button class="big-btn btn-gray" id="btn-prof-back">НАЗАД</button>
</div>

<div id="s-game">
  <canvas id="gcanvas"></canvas>
  <div id="joy-zone"></div>
  <div id="joy-base"></div>
  <div id="joy-stick"></div>
  <div id="kick-btn">УДАР</div>
  <div id="exit-btn">ВЫЙТИ</div>
  <div id="start-btn" class="act-btn">НАЧАТЬ</div>
  <div id="rematch-btn" class="act-btn">РЕВАНШ</div>
</div>

<div id="toast"></div>

<script>
(function () {
"use strict";

var FIELD_W = 840, FIELD_H = 400;
var GOAL_TOP = 150, GOAL_BOTTOM = 250, GOAL_DEPTH = 18;
var CORNER_R = 40;
var PLAYER_R = 15, BALL_R = 8;

var PLAYER_SPEED = 220.0;
var PLAYER_ACCEL = 12.0;

var SEND_HZ = 25;
var SEND_INTERVAL = 1000 / SEND_HZ;

var SELF_CORRECT_TELEPORT = 100;
var SELF_CORRECT_SOFT = 0.08;

var RENDER_DELAY_MS = 100;
var BUFFER_KEEP_MS = 500;
var SNAP_DIST_PLAYER = 150;
var SNAP_DIST_BALL = 200;
var EXTRAPOLATE_MAX_MS = 200;

var GO_SHOW_MS = 900;

var FIELD_COLORS = {
  gray: "#5a5a5a",
  green: "#36793b",
  blue: "#2c5b8f",
  dark: "#1f2226"
};

function genUid() {
  var s = "";
  var chars = "abcdefghijklmnopqrstuvwxyz0123456789";
  for (var i = 0; i < 16; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}

var MY_UID = null;
try {
  MY_UID = localStorage.getItem("hax_uid");
  if (!MY_UID) { MY_UID = genUid(); localStorage.setItem("hax_uid", MY_UID); }
} catch (e) { MY_UID = genUid(); }

var MY_NAME = "Игрок";
try {
  var savedName = localStorage.getItem("hax_name");
  if (savedName) MY_NAME = savedName;
} catch (e) {}

var MY_JERSEY = 0;

var toastEl = document.getElementById("toast");
var toastTimer = null;
function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 2600);
}

var elMenu = document.getElementById("s-menu");
var elProfile = document.getElementById("s-profile");
var elGame = document.getElementById("s-game");
var inName = document.getElementById("in-name");
var inGameName = document.getElementById("in-gamename");
var inCode = document.getElementById("in-code");
var listItemsEl = document.getElementById("list-items");
var startBtn = document.getElementById("start-btn");
var rematchBtn = document.getElementById("rematch-btn");

inName.value = MY_NAME;
inName.addEventListener("input", function () {
  MY_NAME = inName.value.trim() || "Игрок";
  try { localStorage.setItem("hax_name", MY_NAME); } catch (e) {}
});

var cfgMaxPlayers = 4, cfgMatchTime = 180;
var cfgFieldColor = "gray", cfgSpeed = 100, cfgBounce = "normal";

function setupSeg(id, onPick, asString) {
  var el = document.getElementById(id);
  var btns = el.querySelectorAll("button");
  for (var i = 0; i < btns.length; i++) {
    btns[i].addEventListener("click", function (ev) {
      for (var j = 0; j < btns.length; j++) btns[j].classList.remove("active");
      ev.target.classList.add("active");
      var raw = ev.target.getAttribute("data-v");
      onPick(asString ? raw : parseInt(raw, 10));
    });
  }
}
setupSeg("seg-players", function (v) { cfgMaxPlayers = v; });
setupSeg("seg-time", function (v) { cfgMatchTime = v; });
setupSeg("seg-color", function (v) { cfgFieldColor = v; }, true);
setupSeg("seg-speed", function (v) { cfgSpeed = v; });
setupSeg("seg-bounce", function (v) { cfgBounce = v; }, true);

function postJson(url, body) {
  return fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  }).then(function (r) { return r.json(); });
}

var inProfName = document.getElementById("in-prof-name");
var inProfJersey = document.getElementById("in-prof-jersey");
var stMatches = document.getElementById("st-matches");
var stGoals = document.getElementById("st-goals");
var stWins = document.getElementById("st-wins");
var stLosses = document.getElementById("st-losses");
var stDraws = document.getElementById("st-draws");

function hasLocalName() {
  try { return !!localStorage.getItem("hax_name"); } catch (e) { return false; }
}

function fillStats(p) {
  stMatches.textContent = String(p.matches || 0);
  stGoals.textContent = String(p.goals || 0);
  stWins.textContent = String(p.wins || 0);
  stLosses.textContent = String(p.losses || 0);
  stDraws.textContent = String(p.draws || 0);
}

function loadProfile(applyName) {
  return fetch("/api/haxball/profile?uid=" + encodeURIComponent(MY_UID))
    .then(function (r) { return r.json(); })
    .then(function (res) {
      if (!res || !res.ok || !res.profile) return null;
      var p = res.profile;
      MY_JERSEY = parseInt(p.jersey, 10) || 0;
      if (applyName && p.name && !hasLocalName()) {
        MY_NAME = p.name;
        inName.value = MY_NAME;
        try { localStorage.setItem("hax_name", MY_NAME); } catch (e) {}
      }
      return p;
    })
    .catch(function () { return null; });
}

function openProfile() {
  inProfName.value = MY_NAME;
  inProfJersey.value = MY_JERSEY > 0 ? String(MY_JERSEY) : "";
  fillStats({});
  elMenu.style.display = "none";
  elProfile.style.display = "block";
  elProfile.scrollTop = 0;
  loadProfile(false).then(function (p) {
    if (elProfile.style.display === "none") return;
    if (!p) { showToast("Не удалось загрузить профиль"); return; }
    inProfJersey.value = MY_JERSEY > 0 ? String(MY_JERSEY) : "";
    fillStats(p);
  });
}

function closeProfile() {
  elProfile.style.display = "none";
  elMenu.style.display = "block";
  refreshList();
}

inProfJersey.addEventListener("input", function () {
  var v = inProfJersey.value;
  if (v.length > 2) inProfJersey.value = v.slice(0, 2);
});

document.getElementById("btn-profile").addEventListener("click", openProfile);
document.getElementById("btn-prof-back").addEventListener("click", closeProfile);

document.getElementById("btn-prof-save").addEventListener("click", function () {
  var name = inProfName.value.trim().slice(0, 16) || "Игрок";
  var j = parseInt(inProfJersey.value, 10);
  if (isNaN(j) || j < 0) j = 0;
  if (j > 99) j = 99;
  postJson("/api/haxball/profile", { user_id: MY_UID, name: name, jersey: j })
    .then(function (res) {
      if (!res || !res.ok) { showToast("Не удалось сохранить профиль"); return; }
      MY_NAME = name;
      MY_JERSEY = j;
      inName.value = name;
      inProfName.value = name;
      inProfJersey.value = j > 0 ? String(j) : "";
      try { localStorage.setItem("hax_name", MY_NAME); } catch (e) {}
      showToast("Профиль сохранён");
    }).catch(function () { showToast("Ошибка сети"); });
});

document.getElementById("btn-create").addEventListener("click", function () {
  var gname = inGameName.value.trim() || (MY_NAME + " игра");
  postJson("/api/haxball/create", {
    user_id: MY_UID, user_name: MY_NAME, game_name: gname,
    max_players: cfgMaxPlayers, match_time: cfgMatchTime,
    field_color: cfgFieldColor, player_speed: cfgSpeed, ball_bounce: cfgBounce
  }).then(function (res) {
    if (res.ok) enterGame(res.code);
    else showToast("Не удалось создать игру");
  }).catch(function () { showToast("Ошибка сети"); });
});

document.getElementById("btn-join").addEventListener("click", function () {
  var code = inCode.value.trim();
  if (!code) { showToast("Введите код"); return; }
  joinRoom(code);
});

function joinRoom(code) {
  postJson("/api/haxball/join", { code: code, user_id: MY_UID, user_name: MY_NAME })
    .then(function (res) {
      if (res.ok) enterGame(res.code);
      else {
        var msg = "Не удалось войти";
        if (res.error === "not_found") msg = "Комната не найдена";
        else if (res.error === "room_full") msg = "Комната заполнена";
        else if (res.error === "game_over") msg = "Игра уже завершена";
        showToast(msg);
      }
    }).catch(function () { showToast("Ошибка сети"); });
}

function refreshList() {
  if (elMenu.style.display === "none") return;
  fetch("/api/haxball/list").then(function (r) { return r.json(); }).then(function (res) {
    if (!res.ok) return;
    listItemsEl.innerHTML = "";
    if (res.items.length === 0) {
      var d = document.createElement("div");
      d.className = "empty-hint";
      d.textContent = "Нет открытых игр";
      listItemsEl.appendChild(d);
      return;
    }
    res.items.forEach(function (it) {
      var row = document.createElement("div");
      row.className = "list-item";
      var info = document.createElement("div");
      var nameEl = document.createElement("div");
      nameEl.className = "name";
      nameEl.textContent = it.name + " [" + it.code + "]";
      var sub = document.createElement("div");
      sub.className = "info";
      sub.textContent = "Хост: " + it.host + " · " + it.players + "/" + it.max;
      info.appendChild(nameEl);
      info.appendChild(sub);
      var btn = document.createElement("button");
      btn.textContent = "ВОЙТИ";
      btn.addEventListener("click", function () { joinRoom(it.code); });
      row.appendChild(info);
      row.appendChild(btn);
      listItemsEl.appendChild(row);
    });
  }).catch(function () {});
}
setInterval(refreshList, 3000);
refreshList();

var ws = null;
var roomCode = null;
var connected = false;

var serverState = null;
var localSelf = { x: FIELD_W / 2, y: FIELD_H / 2, vx: 0, vy: 0 };
var myTeam = null;

var remoteRender = {};
var ballRender = { x: FIELD_W / 2, y: FIELD_H / 2 };

var snapshotBuffer = [];

var cdBase = 0, cdBaseT = 0;
var prevPhase = null;
var goUntil = 0;

var joyActive = false;
var joyDX = 0, joyDY = 0;
var kickPressed = false;
var lastSendTime = 0;

function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

function clampPlayerPos(x, y) {
  y = clamp(y, PLAYER_R, FIELD_H - PLAYER_R);
  var inMouth = y >= (GOAL_TOP + 2) && y <= (GOAL_BOTTOM - 2);
  if (inMouth) x = clamp(x, -GOAL_DEPTH + 2, FIELD_W + GOAL_DEPTH - 2);
  else x = clamp(x, PLAYER_R, FIELD_W - PLAYER_R);

  var cx = null, cy = null;
  if (x < CORNER_R) cx = CORNER_R;
  else if (x > FIELD_W - CORNER_R) cx = FIELD_W - CORNER_R;
  if (y < CORNER_R) cy = CORNER_R;
  else if (y > FIELD_H - CORNER_R) cy = FIELD_H - CORNER_R;
  if (cx !== null && cy !== null) {
    var dx = x - cx, dy = y - cy;
    var d = Math.hypot(dx, dy);
    var lim = CORNER_R - PLAYER_R;
    if (d > lim && d > 0) {
      x = cx + dx / d * lim;
      y = cy + dy / d * lim;
    }
  }
  return [x, y];
}

function enterGame(code) {
  roomCode = code;
  snapshotBuffer = [];
  remoteRender = {};
  prevPhase = null;
  goUntil = 0;
  cdBase = 0;
  hideActionButtons();
  elMenu.style.display = "none";
  elProfile.style.display = "none";
  elGame.style.display = "block";
  resizeGame();
  loadProfile(false);
  connectWs(code);
  requestAnimationFrame(gameLoop);
}

function leaveGame(silent) {
  if (ws) { try { ws.close(); } catch (e) {} ws = null; }
  connected = false;
  roomCode = null;
  serverState = null;
  remoteRender = {};
  snapshotBuffer = [];
  prevPhase = null;
  goUntil = 0;
  hideActionButtons();
  elGame.style.display = "none";
  elMenu.style.display = "block";
  refreshList();
  if (!silent) showToast("Вы вышли из игры");
}

function pushSnapshot(state) {
  var now = performance.now();
  snapshotBuffer.push({ t: now, players: state.players, ball: state.ball });
  while (snapshotBuffer.length > 0 && now - snapshotBuffer[0].t > BUFFER_KEEP_MS) {
    snapshotBuffer.shift();
  }
}

function hideActionButtons() {
  startBtn.style.display = "none";
  rematchBtn.style.display = "none";
}

function updateButtons(st) {
  var isHost = !!st && st.host_id === MY_UID;
  var canStart = isHost && st.phase === "waiting" && st.players.length >= 2;
  var canRematch = isHost && st.phase === "over";
  startBtn.style.display = canStart ? "block" : "none";
  rematchBtn.style.display = canRematch ? "block" : "none";
}

startBtn.addEventListener("click", function () {
  if (!roomCode) return;
  postJson("/api/haxball/start", { code: roomCode, user_id: MY_UID })
    .then(function (res) {
      if (res.ok) return;
      var msg = "Не удалось начать";
      if (res.error === "not_enough_players") msg = "Нужно минимум 2 игрока";
      else if (res.error === "not_host") msg = "Начать может только хост";
      showToast(msg);
    }).catch(function () { showToast("Ошибка сети"); });
});

rematchBtn.addEventListener("click", function () {

    .then(function (res) {

      if (res.error === "not_host") msg = "Реванш запускает только хост";
      showToast(msg);
    }).catch(function () { showToast("Ошибка сети"); });

function connectWs(code) {
  var proto = location.protocol === "https:" ? "wss:" : "ws:";
  var url = proto + "//" + location.host + "/ws/haxball/" + code + "?uid=" + encodeURIComponent(MY_UID);
  try { ws = new WebSocket(url); }
  catch (e) { showToast("Не удалось подключиться"); leaveGame(true); return; }
  ws.onopen = function () { connected = true; };
  ws.onmessage = function (ev) {
    var data;
    try { data = JSON.parse(ev.data); } catch (e) { return; }
    if (data.type === "state") {
      var st = data.state;
      if (st.phase === "countdown") {
        cdBase = st.countdown_left || 0;
        cdBaseT = performance.now();
      }
      if (prevPhase === "countdown" && st.phase === "battle") {
        goUntil = performance.now() + GO_SHOW_MS;
      }
      prevPhase = st.phase;
      serverState = st;
      myTeam = st.my_side;
      syncSelfFromServer();
      pushSnapshot(st);
      updateButtons(st);
    } else if (data.type === "error") {
      showToast("Комната недоступна");
      leaveGame(true);
    }
  };
  ws.onclose = function () {
    if (roomCode !== null) { showToast("Соединение потеряно"); leaveGame(true); }
  };
  ws.onerror = function () {};
}

function findMe(state) {
  if (!state) return null;
  for (var i = 0; i < state.players.length; i++) {
    if (state.players[i].user_id === MY_UID) return state.players[i];
  }
  return null;
}

function syncSelfFromServer() {
  var me = findMe(serverState);
  if (!me) return;
  if (serverState.phase !== "battle") {
    localSelf.x = me.x; localSelf.y = me.y;
    localSelf.vx = 0; localSelf.vy = 0;
    return;
  }
  var dist = Math.hypot(me.x - localSelf.x, me.y - localSelf.y);
  if (dist > SELF_CORRECT_TELEPORT) {
    localSelf.x = me.x; localSelf.y = me.y;
  } else {
    localSelf.x += (me.x - localSelf.x) * SELF_CORRECT_SOFT;
    localSelf.y += (me.y - localSelf.y) * SELF_CORRECT_SOFT;
  }
}

var isRotated = false;

function localPointFromTouch(clientX, clientY) {
  var rect = elGame.getBoundingClientRect();
  if (isRotated) return { x: clientY - rect.top, y: rect.right - clientX };
  return { x: clientX - rect.left, y: clientY - rect.top };
}

var joyZone = document.getElementById("joy-zone");
var joyBase = document.getElementById("joy-base");
var joyStick = document.getElementById("joy-stick");
var kickBtn = document.getElementById("kick-btn");

var joyTouchId = null;
var joyBaseX = 0, joyBaseY = 0;
var JOY_MAX_R = 45;
var JOY_DEAD = 0.06;

function joyShow(x, y) {
  joyBase.style.display = "block";
  joyStick.style.display = "block";
  joyBase.style.left = (x - 50) + "px";
  joyBase.style.top = (y - 50) + "px";
  joyStick.style.left = (x - 23) + "px";
  joyStick.style.top = (y - 23) + "px";
}
function joyHide() {
  joyBase.style.display = "none";
  joyStick.style.display = "none";
  joyDX = 0; joyDY = 0;
  joyActive = false;
  joyTouchId = null;
}
function joyUpdateStick(dx, dy) {
  var d = Math.hypot(dx, dy);
  var maxD = JOY_MAX_R;
  if (d > maxD) { dx = dx / d * maxD; dy = dy / d * maxD; }
  joyStick.style.left = (joyBaseX + dx - 23) + "px";
  joyStick.style.top = (joyBaseY + dy - 23) + "px";
  var mag = Math.min(1, d / maxD);
  if (mag < JOY_DEAD) { joyDX = 0; joyDY = 0; }
  else { joyDX = dx / maxD; joyDY = dy / maxD; }
}

joyZone.addEventListener("touchstart", function (ev) {
  ev.preventDefault();
  if (joyTouchId !== null) return;
  var t = ev.changedTouches[0];
  var p = localPointFromTouch(t.clientX, t.clientY);
  joyTouchId = t.identifier;
  joyBaseX = p.x; joyBaseY = p.y;
  joyActive = true;
  joyShow(p.x, p.y);
  joyDX = 0; joyDY = 0;
}, { passive: false });

window.addEventListener("touchmove", function (ev) {
  if (joyTouchId === null) return;
  for (var i = 0; i < ev.changedTouches.length; i++) {
    var t = ev.changedTouches[i];
    if (t.identifier === joyTouchId) {
      ev.preventDefault();
      var p = localPointFromTouch(t.clientX, t.clientY);
      joyUpdateStick(p.x - joyBaseX, p.y - joyBaseY);
    }
  }
}, { passive: false });

function joyEndHandler(ev) {
  if (joyTouchId === null) return;
  for (var i = 0; i < ev.changedTouches.length; i++) {
    if (ev.changedTouches[i].identifier === joyTouchId) joyHide();
  }
}
window.addEventListener("touchend", joyEndHandler, { passive: false });
window.addEventListener("touchcancel", joyEndHandler, { passive: false });

var kickTouchId = null;
kickBtn.addEventListener("touchstart", function (ev) {
  ev.preventDefault();
  kickTouchId = ev.changedTouches[0].identifier;
  kickPressed = true;
  kickBtn.classList.add("active");
}, { passive: false });

function kickEndHandler(ev) {
  if (kickTouchId === null) return;
  for (var i = 0; i < ev.changedTouches.length; i++) {
    if (ev.changedTouches[i].identifier === kickTouchId) {
      kickTouchId = null; kickPressed = false; kickBtn.classList.remove("active");
    }
  }
}
window.addEventListener("touchend", kickEndHandler, { passive: false });
window.addEventListener("touchcancel", kickEndHandler, { passive: false });

function stepLocalSelf(dt) {
  if (!serverState || serverState.phase !== "battle") return;
  var speedK = (serverState.player_speed || 100) / 100;
  var desiredVx = joyDX * PLAYER_SPEED * speedK;
  var desiredVy = joyDY * PLAYER_SPEED * speedK;
  var accel = 1 - Math.exp(-PLAYER_ACCEL * dt);
  localSelf.vx += (desiredVx - localSelf.vx) * accel;
  localSelf.vy += (desiredVy - localSelf.vy) * accel;
  localSelf.x += localSelf.vx * dt;
  localSelf.y += localSelf.vy * dt;
  var c = clampPlayerPos(localSelf.x, localSelf.y);
  localSelf.x = c[0]; localSelf.y = c[1];

  // Коллизии с чужими (только с противоположной командой)
  for (var i = 0; i < serverState.players.length; i++) {
    var p = serverState.players[i];
    if (p.user_id === MY_UID) continue;
    if (p.team === myTeam) continue; // свои проходят сквозь
    var rp = remoteRender[p.user_id];
    if (!rp) continue;
    var dx = localSelf.x - rp.x, dy = localSelf.y - rp.y;
    var d = Math.hypot(dx, dy);
    var minD = PLAYER_R * 2;
    if (d > 0 && d < minD) {
      var ux = dx / d, uy = dy / d;
      var overlap = (minD - d) * 0.5;
      localSelf.x += ux * overlap; localSelf.y += uy * overlap;
      var cc = clampPlayerPos(localSelf.x, localSelf.y);
      localSelf.x = cc[0]; localSelf.y = cc[1];
    }
  }

  // Не даём своей фигуре залезать внутрь мяча (только локально на клиенте).
  var bdx = localSelf.x - ballRender.x;
  var bdy = localSelf.y - ballRender.y;
  var bd = Math.hypot(bdx, bdy);
  var bmin = PLAYER_R + BALL_R;
  if (bd < bmin && bd > 0.001) {
    var bux = bdx / bd, buy = bdy / bd;
    var boverlap = bmin - bd;
    localSelf.x += bux * boverlap;
    localSelf.y += buy * boverlap;
    var bc = clampPlayerPos(localSelf.x, localSelf.y);
    localSelf.x = bc[0];
    localSelf.y = bc[1];
  }
}

function maybeSendState(now) {
  if (!connected || !ws || ws.readyState !== 1) return;
  if (now - lastSendTime < SEND_INTERVAL) return;
  lastSendTime = now;
  try {
    ws.send(JSON.stringify({
      action: "move",
      x: localSelf.x, y: localSelf.y,
      vx: localSelf.vx, vy: localSelf.vy,
      kick: kickPressed
    }));
  } catch (e) {}
}

// ==================== ИНТЕРПОЛЯЦИЯ + ЭКСТРАПОЛЯЦИЯ ====================

function lerp(a, b, t) { return a + (b - a) * t; }

function lerpPos(ax, ay, bx, by, alpha, snapDist) {
  if (Math.hypot(bx - ax, by - ay) > snapDist) return [bx, by];
  return [lerp(ax, bx, alpha), lerp(ay, by, alpha)];
}

function applySnapshot(s) {
  var out = {};
  for (var i = 0; i < s.players.length; i++) {
    var p = s.players[i];
    if (p.user_id === MY_UID) continue;
    out[p.user_id] = {
      x: p.x, y: p.y,
      name: p.name, team: p.team, slot: p.slot, jersey: p.jersey || 0,
      kick_glow: p.kick_glow
    };
  }
  remoteRender = out;
  ballRender.x = s.ball.x;
  ballRender.y = s.ball.y;
}

// Экстраполяция: снапшот опоздал — двигаем объекты по их скорости
function extrapolateFrom(s, dtSec) {
  var out = {};
  for (var i = 0; i < s.players.length; i++) {
    var p = s.players[i];
    if (p.user_id === MY_UID) continue;
    out[p.user_id] = {
      x: p.x + (p.vx || 0) * dtSec,
      y: p.y + (p.vy || 0) * dtSec,
      name: p.name, team: p.team, slot: p.slot, jersey: p.jersey || 0,
      kick_glow: p.kick_glow
    };
  }
  remoteRender = out;
  ballRender.x = s.ball.x + (s.ball.vx || 0) * dtSec;
  ballRender.y = s.ball.y + (s.ball.vy || 0) * dtSec;
}

function renderInterpolated(now) {
  var n = snapshotBuffer.length;
  if (n === 0) return;
  if (n === 1) {
    applySnapshot(snapshotBuffer[0]);
    return;
  }

  var rt = now - RENDER_DELAY_MS;

  if (rt <= snapshotBuffer[0].t) {
    applySnapshot(snapshotBuffer[0]);
    return;
  }

  // Экстраполяция: rt новее последнего снапшота
  var lastSnap = snapshotBuffer[n - 1];
  if (rt > lastSnap.t) {
    var dtMs = rt - lastSnap.t;
    if (dtMs > EXTRAPOLATE_MAX_MS) dtMs = EXTRAPOLATE_MAX_MS;
    extrapolateFrom(lastSnap, dtMs / 1000);
    return;
  }

  var A = null, B = null;
  for (var i = 0; i < n - 1; i++) {
    if (snapshotBuffer[i].t <= rt && rt <= snapshotBuffer[i + 1].t) {
      A = snapshotBuffer[i];
      B = snapshotBuffer[i + 1];
      break;
    }
  }
  if (!A) {
    applySnapshot(snapshotBuffer[n - 1]);
    return;
  }

  var span = B.t - A.t;
  var alpha = span > 0 ? (rt - A.t) / span : 1;
  if (alpha < 0) alpha = 0;
  if (alpha > 1) alpha = 1;

  var aById = {};
  for (var ai = 0; ai < A.players.length; ai++) aById[A.players[ai].user_id] = A.players[ai];

  var out = {};
  for (var bi = 0; bi < B.players.length; bi++) {
    var pb = B.players[bi];
    if (pb.user_id === MY_UID) continue;
    var pa = aById[pb.user_id];
    var px, py, glow;
    if (pa) {
      var pos = lerpPos(pa.x, pa.y, pb.x, pb.y, alpha, SNAP_DIST_PLAYER);
      px = pos[0]; py = pos[1];
      glow = alpha < 0.5 ? pa.kick_glow : pb.kick_glow;
    } else {
      px = pb.x; py = pb.y;
      glow = pb.kick_glow;
    }
    out[pb.user_id] = {
      x: px, y: py,
      name: pb.name, team: pb.team, slot: pb.slot, jersey: pb.jersey || 0,
      kick_glow: glow
    };
  }
  remoteRender = out;

  var bp = lerpPos(A.ball.x, A.ball.y, B.ball.x, B.ball.y, alpha, SNAP_DIST_BALL);
  ballRender.x = bp[0];
  ballRender.y = bp[1];
}

// ==================== РЕНДЕР ====================

var canvas = document.getElementById("gcanvas");
var ctx = canvas.getContext("2d");

// Offscreen canvas для статики поля
var fieldCanvas = document.createElement("canvas");
fieldCanvas.width = FIELD_W;
fieldCanvas.height = FIELD_H;
var fieldCtx = fieldCanvas.getContext("2d");
var fieldColorDrawn = null;

function fieldToScreen(cw, ch) {
  var margin = 40;
  var scale = Math.min((cw - margin * 2) / FIELD_W, (ch - margin * 2 - 60) / FIELD_H);
  var offX = (cw - FIELD_W * scale) / 2;
  var offY = (ch - FIELD_H * scale) / 2 + 30;
  return { scale: scale, offX: offX, offY: offY };
}

function roundRectPathTo(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.lineTo(x + w - r, y);
  c.arc(x + w - r, y + r, r, -Math.PI / 2, 0);
  c.lineTo(x + w, y + h - r);
  c.arc(x + w - r, y + h - r, r, 0, Math.PI / 2);
  c.lineTo(x + r, y + h);
  c.arc(x + r, y + h - r, r, Math.PI / 2, Math.PI);
  c.lineTo(x, y + r);
  c.arc(x + r, y + r, r, Math.PI, Math.PI * 1.5);
  c.closePath();
}

// Рисует статическую часть поля в offscreen canvas (один раз)
function redrawFieldStatic(colorKey) {
  var c = fieldCtx;
  var s = 1, ox = 0, oy = 0;
  var baseColor = FIELD_COLORS[colorKey] || FIELD_COLORS.gray;

  c.clearRect(0, 0, FIELD_W, FIELD_H);
  c.fillStyle = "#111";
  c.fillRect(0, 0, FIELD_W, FIELD_H);

  roundRectPathTo(c, ox, oy, FIELD_W, FIELD_H, CORNER_R);
  c.fillStyle = baseColor;
  c.fill();

  c.save();
  c.clip();

  c.fillStyle = "rgba(0,0,0,0.06)";
  var sections = 8;
  for (var i = 0; i < sections; i += 2) {
    c.fillRect(i * (FIELD_W / sections), 0, (FIELD_W / sections), FIELD_H);
  }

  c.strokeStyle = "#ffffff";
  c.lineWidth = 2;

  c.beginPath();
  c.moveTo(FIELD_W / 2, 0);
  c.lineTo(FIELD_W / 2, FIELD_H);
  c.stroke();

  c.beginPath();
  c.arc(FIELD_W / 2, FIELD_H / 2, 65, 0, Math.PI * 2);
  c.stroke();

  c.fillStyle = "#fff";
  c.beginPath();
  c.arc(FIELD_W / 2, FIELD_H / 2, 3, 0, Math.PI * 2);
  c.fill();

  c.beginPath(); c.arc(70, FIELD_H / 2, 3, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.arc(770, FIELD_H / 2, 3, 0, Math.PI * 2); c.fill();

  c.beginPath();
  c.arc(70, FIELD_H / 2, 90, -Math.PI * 0.32, Math.PI * 0.32);
  c.stroke();
  c.beginPath();
  c.arc(770, FIELD_H / 2, 90, Math.PI - Math.PI * 0.32, Math.PI + Math.PI * 0.32);
  c.stroke();

  c.restore();

  c.strokeStyle = "#ffffff";
  c.lineWidth = 2;
  roundRectPathTo(c, 0, 0, FIELD_W, FIELD_H, CORNER_R);
  c.stroke();

  c.fillStyle = "#333333";
  c.fillRect(-GOAL_DEPTH, GOAL_TOP, GOAL_DEPTH, GOAL_BOTTOM - GOAL_TOP);
  c.fillRect(FIELD_W, GOAL_TOP, GOAL_DEPTH, GOAL_BOTTOM - GOAL_TOP);

  c.strokeStyle = "#ffffff";
  c.lineWidth = 4;
  c.beginPath();
  c.moveTo(-GOAL_DEPTH, GOAL_TOP); c.lineTo(0, GOAL_TOP);
  c.moveTo(-GOAL_DEPTH, GOAL_BOTTOM); c.lineTo(0, GOAL_BOTTOM);
  c.moveTo(FIELD_W, GOAL_TOP); c.lineTo(FIELD_W + GOAL_DEPTH, GOAL_TOP);
  c.moveTo(FIELD_W, GOAL_BOTTOM); c.lineTo(FIELD_W + GOAL_DEPTH, GOAL_BOTTOM);
  c.stroke();

  fieldColorDrawn = colorKey;
}

function drawField(cw, ch, state) {
  var colorKey = state && state.field_color ? state.field_color : "gray";
  if (fieldColorDrawn !== colorKey) {
    redrawFieldStatic(colorKey);
  }

  ctx.fillStyle = "#111";
  ctx.fillRect(0, 0, cw, ch);

  var m = fieldToScreen(cw, ch);
  ctx.drawImage(fieldCanvas, m.offX, m.offY, FIELD_W * m.scale, FIELD_H * m.scale);
}

function drawPlayer(m, x, y, team, slot, name, glow, jersey) {
  var sx = m.offX + x * m.scale;
  var sy = m.offY + y * m.scale;
  var r = PLAYER_R * m.scale;

  var displayNumber = (jersey > 0) ? jersey : slot;

  if (glow) {
    ctx.beginPath();
    ctx.arc(sx, sy, r + 5, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,255,255,0.35)";
    ctx.fill();
  }

  ctx.beginPath();
  ctx.arc(sx, sy, r, 0, Math.PI * 2);
  ctx.fillStyle = team === "left" ? "#3a5fdc" : "#dc4040";
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = "#000";
  ctx.stroke();

  ctx.fillStyle = "#fff";
  ctx.font = "bold " + Math.round(14 * m.scale) + "px sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(String(displayNumber), sx, sy);

  ctx.font = "bold " + Math.round(12 * m.scale) + "px sans-serif";
  ctx.shadowColor = "#000";
  ctx.shadowBlur = 3;
  ctx.fillText(name, sx, sy + r + 12 * m.scale);
  ctx.shadowBlur = 0;
}

function drawBall(m, x, y) {
  var sx = m.offX + x * m.scale;
  var sy = m.offY + y * m.scale;
  var r = BALL_R * m.scale;
  ctx.beginPath();
  ctx.arc(sx, sy, r, 0, Math.PI * 2);
  ctx.fillStyle = "#e8e000";
  ctx.fill();
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = "#000";
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(sx - r * 0.35, sy - r * 0.35, r * 0.28, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(255,255,255,0.8)";
  ctx.fill();
}

function fmtTime(t) {
  t = Math.max(0, Math.round(t));
  var mm = Math.floor(t / 60), ss = t % 60;
  return (mm < 10 ? "0" : "") + mm + ":" + (ss < 10 ? "0" : "") + ss;
}

function phaseLabel(state) {
  if (state.phase === "waiting") {
    if (state.players.length < 2) return "ЖДЁМ ИГРОКОВ";
    return state.host_id === MY_UID ? "НАЖМИТЕ НАЧАТЬ" : "ЖДЁМ НАЧАЛА";
  }
  if (state.phase === "goal_pause") return "ГОЛ!";
  if (state.phase === "over") {
    if (state.winner === "draw") return "НИЧЬЯ";
    if (state.winner === state.my_side) return "ПОБЕДА";
    return "ПОРАЖЕНИЕ";
  }
  return "";
}

function drawHud(cw, ch, state) {
  ctx.textAlign = "center";
  ctx.textBaseline = "alphabetic";

  ctx.font = "bold 32px sans-serif";
  ctx.fillStyle = "#3a5fdc";
  ctx.fillText(String(state.score.left), cw / 2 - 26, 40);
  ctx.fillStyle = "#fff";
  ctx.fillText(":", cw / 2, 40);
  ctx.fillStyle = "#dc4040";
  ctx.fillText(String(state.score.right), cw / 2 + 26, 40);

  ctx.font = "13px sans-serif";
  ctx.fillStyle = "#ccc";
  var sideLabel = state.my_side === "left" ? "ВЫ — СИНИЕ" : (state.my_side === "right" ? "ВЫ — КРАСНЫЕ" : "");
  ctx.fillText(fmtTime(state.timer) + "  ·  код " + (roomCode || "") + "  ·  " + sideLabel, cw / 2, 58);

  var lbl = phaseLabel(state);
  if (lbl) {
    ctx.font = "bold 22px sans-serif";
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,0.6)";
    ctx.shadowBlur = 6;
    ctx.fillText(lbl, cw / 2, ch / 2 - 20);
    ctx.shadowBlur = 0;
  }
}

function drawCountdown(cw, ch, m, state) {
  var now = performance.now();
  var cx = cw / 2;
  var cy = m.offY + FIELD_H * m.scale / 2;
  var base = Math.min(cw, ch);

  if (state.phase === "countdown") {
    var left = cdBase - (now - cdBaseT) / 1000;
    if (left < 0) left = 0;
    var digit = Math.ceil(left);
    if (digit < 1) digit = 1;
    if (digit > 5) digit = 5;
    var frac = digit - left;
    if (frac < 0) frac = 0;
    if (frac > 1) frac = 1;
    var size = base * 0.42 * (1.1 - 0.25 * frac);

    ctx.save();
    ctx.globalAlpha = 1 - 0.6 * frac;
    ctx.font = "bold " + Math.round(size) + "px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.shadowColor = "rgba(0,0,0,0.7)";
    ctx.shadowBlur = 14;
    ctx.fillStyle = "#e8e000";
    ctx.fillText(String(digit), cx, cy);
    ctx.restore();
    return;
  }

  if (now < goUntil) {
    var k = (goUntil - now) / GO_SHOW_MS;
    ctx.save();
    ctx.globalAlpha = Math.min(1, k * 1.5);
    ctx.font = "bold " + Math.round(base * 0.3) + "px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.shadowColor = "rgba(0,0,0,0.7)";
    ctx.shadowBlur = 14;
    ctx.fillStyle = "#2fe06a";
    ctx.fillText("GO!", cx, cy);
    ctx.restore();
  }
}

function render() {
  var cw = isRotated ? vh : vw;
  var ch = isRotated ? vw : vh;

  drawField(cw, ch, serverState);
  var m = fieldToScreen(cw, ch);

  if (serverState) {
    for (var i = 0; i < serverState.players.length; i++) {
      var p = serverState.players[i];
      if (p.user_id === MY_UID) continue;
      var r = remoteRender[p.user_id];
      if (!r) continue;
      drawPlayer(m, r.x, r.y, r.team, r.slot, r.name, r.kick_glow, r.jersey);
    }
    var me = findMe(serverState);
    if (me) drawPlayer(m, localSelf.x, localSelf.y, me.team, me.slot, MY_NAME, me.kick_glow, me.jersey);
    drawBall(m, ballRender.x, ballRender.y);
    drawHud(cw, ch, serverState);
    drawCountdown(cw, ch, m, serverState);
  } else {
    ctx.fillStyle = "#fff";
    ctx.font = "16px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("Подключение...", cw / 2, ch / 2);
  }
}

var lastFrameTime = performance.now();

function gameLoop(now) {
  if (elGame.style.display === "none") return;
  var dt = (now - lastFrameTime) / 1000;
  if (dt > 0.05) dt = 0.05;
  lastFrameTime = now;

  stepLocalSelf(dt);
  renderInterpolated(performance.now());
  maybeSendState(now);
  render();

  requestAnimationFrame(gameLoop);
}

resizeGame();
loadProfile(true);

})();
</script>
