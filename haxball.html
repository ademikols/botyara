<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Haxball</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;min-height:100vh;overflow-x:hidden}
  .top{padding:14px 16px;border-bottom:1px solid #1a1a1a;text-align:center}
  .top h1{font-size:13px;letter-spacing:4px;font-weight:700;text-transform:uppercase}
  .screen{display:none;padding:20px}
  .screen.active{display:block}
  .btn{width:100%;padding:16px;background:#fff;color:#000;border:1px solid #fff;font-family:inherit;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;margin-bottom:10px}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:transparent;color:#fff}
  .btn.sm{padding:11px;font-size:11px;letter-spacing:1px}
  .btn.danger{background:transparent;color:#ff4444;border-color:#ff4444}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#777;margin-bottom:7px}
  .field input{width:100%;padding:15px;background:#0d0d0d;border:1px solid #222;color:#fff;font-family:inherit;font-size:15px;outline:none}
  .field input:focus{border-color:#fff}
  .field input.code{font-family:'SF Mono',monospace;font-size:26px;text-align:center;letter-spacing:8px;font-weight:700;padding-left:26px}
  .code-box{border:1px solid #fff;padding:24px 18px;text-align:center;margin:16px 0}
  .code-box .lbl{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#777;margin-bottom:10px}
  .code-box .code{font-family:'SF Mono',monospace;font-size:38px;font-weight:700;letter-spacing:6px;margin-bottom:16px}
  .msg{text-align:center;padding:14px;font-size:13px;letter-spacing:1px;color:#888;line-height:1.5}
  .big{text-align:center;padding:8px;font-size:15px;font-weight:700;letter-spacing:2px}
  .divider{height:1px;background:#1a1a1a;margin:16px 0}
  .back-btn{background:transparent;border:none;color:#666;font-size:12px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;font-family:inherit;padding:8px 0;margin-bottom:8px}
  .back-btn:active{color:#fff}
  .status{text-align:center;font-size:12px;color:#888;padding:8px;letter-spacing:1px}
  .status .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ff4444;margin-right:6px}
  .status .dot.on{background:#44ff88}
  .lobby-card{border:1px solid #222;background:#0d0d0d;padding:12px;margin-bottom:8px;border-radius:8px;cursor:pointer}
  .lobby-card:active{border-color:#fff}
  .lobby-card .title{font-size:14px;font-weight:700;margin-bottom:4px}
  .lobby-card .meta{font-size:11px;color:#888}

  /* ===== Игровой экран ===== */
  #s-game{padding:0;display:none;flex-direction:column;height:100vh;background:#000}
  #s-game.active{display:flex}
  .game-top{padding:6px 10px 0;flex-shrink:0;text-align:center}
  .score-row{display:flex;align-items:center;justify-content:center;gap:16px;font-size:26px;font-weight:900;font-family:'SF Mono',monospace;padding:4px 0}
  .score-left{color:#4488ff}
  .score-right{color:#ff6b6b}
  .score-sep{color:#333}
  .meta-row{font-size:11px;color:#888;letter-spacing:1px;padding-bottom:4px}
  .meta-row b{color:#fff;font-weight:700}

  .canvas-wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:4px 10px}
  #hb-canvas{width:100%;max-width:820px;background:#0a1a0a;border:1px solid #1a1a1a;aspect-ratio:8/5;touch-action:none;border-radius:6px}

  .controls{flex-shrink:0;padding:10px 14px 14px;display:flex;justify-content:space-between;align-items:center;gap:14px}
  .joy{position:relative;width:120px;height:120px;border-radius:50%;background:#0d0d0d;border:2px solid #222;touch-action:none;flex-shrink:0}
  .joy-stick{position:absolute;width:56px;height:56px;border-radius:50%;background:#fff;border:2px solid #000;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none}
  .kick{flex:1;max-width:200px;height:110px;border-radius:16px;background:#ff6b6b;color:#000;border:2px solid #ff6b6b;font-family:inherit;font-weight:900;font-size:16px;letter-spacing:2px;text-transform:uppercase;cursor:pointer}
  .kick:active{background:#ff5252;transform:scale(.97)}
  .game-bottom{padding:0 14px 14px;flex-shrink:0;display:flex;gap:8px}
  .game-bottom .btn{margin:0;flex:1}
  .phase-info{text-align:center;font-size:12px;color:#aaa;padding:2px 0 6px;min-height:18px}
  .phase-info.win{color:#44ff88;font-weight:700}
  .phase-info.lose{color:#ff4444;font-weight:700}
</style>
</head>
<body>

<div class="top"><h1>⚽ HAXBALL</h1></div>

<!-- МЕНЮ -->
<div id="s-menu" class="screen active">
  <button class="back-btn" onclick="location.href='/app.html'">← К ИГРАМ</button>

  <div class="field"><label>Ваше имя</label><input id="hbName" type="text" placeholder="Игрок" maxlength="20"></div>

  <div class="divider"></div>

  <div class="big" style="margin-bottom:10px">СОЗДАТЬ ИГРУ</div>
  <div class="field"><label>Название комнаты</label><input id="hbRoomName" type="text" placeholder="Комната" maxlength="30"></div>
  <button class="btn" onclick="hbCreate()">СОЗДАТЬ</button>

  <div class="divider"></div>

  <div class="big" style="margin-bottom:10px">ВОЙТИ ПО КОДУ</div>
  <div class="field"><label>Код комнаты</label><input id="hbJoinCode" type="tel" inputmode="numeric" maxlength="6" class="code" placeholder="000000"></div>
  <button class="btn ghost" onclick="hbJoinByCode()">ВОЙТИ</button>

  <div class="divider"></div>

  <div class="big" style="margin-bottom:10px">ОТКРЫТЫЕ ИГРЫ</div>
  <div id="hbLobbyList"><div class="msg">Загрузка...</div></div>
  <button class="btn ghost" onclick="hbLoadLobbies()">🔄 ОБНОВИТЬ</button>
</div>

<!-- ИГРА -->
<div id="s-game">
  <div class="game-top">
    <div class="status"><span class="dot" id="hbDot"></span><span id="hbStatus">ПОДКЛЮЧЕНИЕ...</span></div>
    <div class="score-row">
      <span class="score-left" id="hbScoreL">0</span>
      <span class="score-sep">:</span>
      <span class="score-right" id="hbScoreR">0</span>
    </div>
    <div class="meta-row">ТАЙМЕР <b id="hbTimer">120</b> · КОД <b id="hbCodeTag">------</b> · ВЫ — <b id="hbMyTeam">—</b></div>
    <div class="phase-info" id="hbPhase">Ожидание...</div>
  </div>

  <div class="canvas-wrap">
    <canvas id="hb-canvas" width="800" height="500"></canvas>
  </div>

  <div class="controls">
    <div class="joy" id="hbJoy"><div class="joy-stick" id="hbJoyStick"></div></div>
    <button class="kick" id="hbKick">УДАР</button>
  </div>

  <div class="game-bottom">
    <button class="btn sm ghost" onclick="hbLeave()">ВЫЙТИ</button>
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();

// ----- Пользователь -----
const USER_ID = tg?.initDataUnsafe?.user?.id || Date.now();
let USERNAME = tg?.initDataUnsafe?.user?.first_name || ('guest' + String(USER_ID).slice(-4));
document.getElementById('hbName').value = USERNAME;

// ----- Состояние -----
const HB = {
  code: null,
  ws: null,
  state: null,
  input: {up:false, down:false, left:false, right:false, kick:false},
  canvas: null,
  ctx: null,
  raf: null,
  lastSendTs: 0,
  joyActive: false
};

// ----- Навигация -----
function hbGo(id){
  document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));
  document.getElementById('s-'+id).classList.add('active');
}

// ============================================================================
// МЕНЮ: API
// ============================================================================

async function hbCreate(){
  const name = document.getElementById('hbName').value.trim() || USERNAME;
  const roomName = document.getElementById('hbRoomName').value.trim() || 'Haxball';
  USERNAME = name;
  try {
    const r = await fetch('/api/haxball/create', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({user_id: USER_ID, user_name: name, game_name: roomName})
    });
    const d = await r.json();
    if (!d.ok) { tg?.showAlert?.(d.error || 'Ошибка'); return; }
    HB.code = d.code;
    hbStartGame();
  } catch(e) { tg?.showAlert?.(e.message); }
}

async function hbJoinByCode(){
  const name = document.getElementById('hbName').value.trim() || USERNAME;
  const code = document.getElementById('hbJoinCode').value.trim();
  if (code.length !== 6) { tg?.showAlert?.('Код из 6 цифр'); return; }
  USERNAME = name;
  try {
    const r = await fetch('/api/haxball/join', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({code: code, user_id: USER_ID, user_name: name})
    });
    const d = await r.json();
    if (!d.ok) { tg?.showAlert?.(d.error || 'Ошибка'); return; }
    HB.code = d.code || code;
    hbStartGame();
  } catch(e) { tg?.showAlert?.(e.message); }
}

async function hbJoinLobby(code){
  const name = document.getElementById('hbName').value.trim() || USERNAME;
  USERNAME = name;
  try {
    const r = await fetch('/api/haxball/join', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({code: code, user_id: USER_ID, user_name: name})
    });
    const d = await r.json();
    if (!d.ok) { tg?.showAlert?.(d.error || 'Ошибка'); return; }
    HB.code = d.code || code;
    hbStartGame();
  } catch(e) { tg?.showAlert?.(e.message); }
}

async function hbLoadLobbies(){
  const box = document.getElementById('hbLobbyList');
  box.innerHTML = '<div class="msg">Загрузка...</div>';
  try {
    const r = await fetch('/api/haxball/list');
    const d = await r.json();
    if (!d.ok || !d.items || !d.items.length) {
      box.innerHTML = '<div class="msg">Открытых игр пока нет<br>Создай свою или войди по коду</div>';
      return;
    }
    box.innerHTML = d.items.map(it => `
      <div class="lobby-card" onclick="hbJoinLobby('${it.code}')">
        <div class="title">${escapeHtml(it.name)}</div>
        <div class="meta">${it.players}/${it.max} · хост: ${escapeHtml(it.host)}</div>
      </div>
    `).join('');
  } catch(e) {
    box.innerHTML = '<div class="msg">Ошибка: ' + escapeHtml(e.message) + '</div>';
  }
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ============================================================================
// ИГРА
// ============================================================================

function hbStartGame(){
  hbGo('game');
  document.getElementById('hbCodeTag').textContent = HB.code;
  hbInitCanvas();
  hbConnect();
  hbLoop();
}

function hbConnect(){
  if (HB.ws) { try { HB.ws.close(); } catch(e){} }
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const url = `${proto}://${location.host}/ws/haxball/${HB.code}?uid=${USER_ID}`;
  HB.ws = new WebSocket(url);
  HB.ws.onopen = () => hbDot(true);
  HB.ws.onclose = () => hbDot(false);
  HB.ws.onerror = () => hbDot(false);
  HB.ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.type === 'state') HB.state = msg.state;
      else if (msg.type === 'error') console.warn('[hb]', msg.error);
    } catch(err) {}
  };
}

function hbDot(on){
  document.getElementById('hbDot').classList.toggle('on', on);
  document.getElementById('hbStatus').textContent = on ? 'В СЕТИ' : 'НЕТ СВЯЗИ';
}

function hbLeave(){
  if (HB.ws) { try { HB.ws.close(); } catch(e){} }
  if (HB.raf) cancelAnimationFrame(HB.raf);
  HB.code = null; HB.state = null; HB.ws = null;
  hbGo('menu');
  hbLoadLobbies();
}

// ============================================================================
// УПРАВЛЕНИЕ
// ============================================================================

function hbInitCanvas(){
  HB.canvas = document.getElementById('hb-canvas');
  HB.ctx = HB.canvas.getContext('2d');

  // Клавиатура (для теста на ПК)
  document.addEventListener('keydown', hbKeyDown);
  document.addEventListener('keyup', hbKeyUp);

  // Джойстик
  const joy = document.getElementById('hbJoy');
  const stick = document.getElementById('hbJoyStick');
  const THRESH = 0.3;

  function updateJoy(t){
    const rect = joy.getBoundingClientRect();
    const cx = rect.left + rect.width/2;
    const cy = rect.top + rect.height/2;
    let dx = t.clientX - cx;
    let dy = t.clientY - cy;
    const dist = Math.hypot(dx, dy);
    const maxR = rect.width/2 - 26;
    if (dist > maxR) { dx = dx / dist * maxR; dy = dy / dist * maxR; }
    stick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    const nx = dx / maxR;
    const ny = dy / maxR;
    HB.input.left  = nx < -THRESH;
    HB.input.right = nx >  THRESH;
    HB.input.up    = ny < -THRESH;
    HB.input.down  = ny >  THRESH;
  }

  joy.addEventListener('touchstart', (e) => {
    e.preventDefault();
    HB.joyActive = true;
    updateJoy(e.touches[0]);
  }, {passive:false});

  joy.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if (!HB.joyActive) return;
    updateJoy(e.touches[0]);
  }, {passive:false});

  joy.addEventListener('touchend', (e) => {
    e.preventDefault();
    HB.joyActive = false;
    HB.input.up = HB.input.down = HB.input.left = HB.input.right = false;
    stick.style.transform = 'translate(-50%, -50%)';
  }, {passive:false});

  // Кнопка удара
  const kick = document.getElementById('hbKick');
  const kickOn = (e) => { e.preventDefault(); HB.input.kick = true; };
  const kickOff = (e) => { e.preventDefault(); HB.input.kick = false; };
  kick.addEventListener('touchstart', kickOn, {passive:false});
  kick.addEventListener('touchend', kickOff, {passive:false});
  kick.addEventListener('touchcancel', kickOff, {passive:false});
  kick.addEventListener('mousedown', kickOn);
  kick.addEventListener('mouseup', kickOff);
  kick.addEventListener('mouseleave', kickOff);
}

function hbKeyDown(e){
  if (e.repeat) return;
  const k = e.key;
  if (k === 'ArrowUp'    || k === 'w' || k === 'W' || k === 'ц' || k === 'Ц') HB.input.up = true;
  if (k === 'ArrowDown'  || k === 's' || k === 'S' || k === 'ы' || k === 'Ы') HB.input.down = true;
  if (k === 'ArrowLeft'  || k === 'a' || k === 'A' || k === 'ф' || k === 'Ф') HB.input.left = true;
  if (k === 'ArrowRight' || k === 'd' || k === 'D' || k === 'в' || k === 'В') HB.input.right = true;
  if (k === ' ') { HB.input.kick = true; e.preventDefault(); }
}
function hbKeyUp(e){
  const k = e.key;
  if (k === 'ArrowUp'    || k === 'w' || k === 'W' || k === 'ц' || k === 'Ц') HB.input.up = false;
  if (k === 'ArrowDown'  || k === 's' || k === 'S' || k === 'ы' || k === 'Ы') HB.input.down = false;
  if (k === 'ArrowLeft'  || k === 'a' || k === 'A' || k === 'ф' || k === 'Ф') HB.input.left = false;
  if (k === 'ArrowRight' || k === 'd' || k === 'D' || k === 'в' || k === 'В') HB.input.right = false;
  if (k === ' ') HB.input.kick = false;
}

// ============================================================================
// ЦИКЛ
// ============================================================================

function hbLoop(){
  // Отправка ввода 20 раз в секунду
  const now = performance.now();
  if (HB.ws && HB.ws.readyState === 1 && now - HB.lastSendTs > 50) {
    HB.lastSendTs = now;
    HB.ws.send(JSON.stringify({
      action: 'move',
      up: HB.input.up, down: HB.input.down,
      left: HB.input.left, right: HB.input.right,
      kick: HB.input.kick
    }));
  }

  if (HB.state) {
    hbRender();
    hbUpdateHUD();
  }
  HB.raf = requestAnimationFrame(hbLoop);
}

// ============================================================================
// РЕНДЕР
// ============================================================================

const FIELD_W = 800;
const FIELD_H = 500;
const PLAYER_R = 15;
const BALL_R = 8;
const GOAL_H = 120;
const GOAL_Y = (FIELD_H - GOAL_H) / 2;

function hbRender(){
  const ctx = HB.ctx;
  const s = HB.state;

  // Поле
  ctx.fillStyle = '#0a1a0a';
  ctx.fillRect(0, 0, FIELD_W, FIELD_H);

  // Трава полосками
  const stripeW = FIELD_W / 10;
  for (let i = 0; i < 10; i++){
    ctx.fillStyle = i % 2 === 0 ? '#0d220d' : '#0a1a0a';
    ctx.fillRect(i * stripeW, 0, stripeW, FIELD_H);
  }

  // Центральная линия
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(FIELD_W/2, 0);
  ctx.lineTo(FIELD_W/2, FIELD_H);
  ctx.stroke();

  // Центральный круг
  ctx.beginPath();
  ctx.arc(FIELD_W/2, FIELD_H/2, 60, 0, Math.PI*2);
  ctx.stroke();

  // Ворота (штриховые линии)
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(0, GOAL_Y);
  ctx.lineTo(0, GOAL_Y + GOAL_H);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(FIELD_W, GOAL_Y);
  ctx.lineTo(FIELD_W, GOAL_Y + GOAL_H);
  ctx.stroke();

  // Заливка ворот
  ctx.fillStyle = 'rgba(68,136,255,0.15)';
  ctx.fillRect(0, GOAL_Y, 6, GOAL_H);
  ctx.fillStyle = 'rgba(255,107,107,0.15)';
  ctx.fillRect(FIELD_W-6, GOAL_Y, 6, GOAL_H);

  // Игроки
  for (const p of (s.players || [])){
    const isMe = p.user_id === USER_ID;
    const color = p.team === 'left' ? '#4488ff' : '#ff6b6b';
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, PLAYER_R, 0, Math.PI*2);
    ctx.fill();

    // Обводка для себя
    if (isMe) {
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 3;
    } else {
      ctx.strokeStyle = 'rgba(0,0,0,0.5)';
      ctx.lineWidth = 2;
    }
    ctx.stroke();

    // Метка "Я"
    if (isMe) {
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 11px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('Я', p.x, p.y);
    } else {
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.font = '10px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillText((p.name || '').slice(0, 8), p.x, p.y + PLAYER_R + 2);
    }
  }

  // Мяч
  if (s.ball){
    ctx.fillStyle = '#ffe066';
    ctx.beginPath();
    ctx.arc(s.ball.x, s.ball.y, BALL_R, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }
}

function hbUpdateHUD(){
  const s = HB.state;
  document.getElementById('hbScoreL').textContent = s.score.left;
  document.getElementById('hbScoreR').textContent = s.score.right;
  document.getElementById('hbTimer').textContent = s.timer;

  const teamName = s.my_side === 'left' ? 'СИНИЕ' : (s.my_side === 'right' ? 'КРАСНЫЕ' : '—');
  document.getElementById('hbMyTeam').textContent = teamName;

  const phase = document.getElementById('hbPhase');
  phase.classList.remove('win', 'lose');

  if (s.phase === 'waiting'){
    phase.textContent = 'ЖДЁМ ИГРОКОВ...';
  } else if (s.phase === 'goal_pause'){
    phase.textContent = '⚽ ГОЛ!';
  } else if (s.phase === 'over'){
    if (s.winner === 'draw'){
      phase.textContent = '🤝 НИЧЬЯ';
    } else if (s.winner === s.my_side){
      phase.textContent = '🏆 ПОБЕДА';
      phase.classList.add('win');
    } else {
      phase.textContent = '💀 ПОРАЖЕНИЕ';
      phase.classList.add('lose');
    }
  } else {
    phase.textContent = 'ИГРА ИДЁТ';
  }
}

// ============================================================================
// СТАРТ
// ============================================================================

hbLoadLobbies();
</script>
</body>
</html>
